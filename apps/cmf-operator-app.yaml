# Sourced directly from Confluent's Helm chart repo via Argo CD's native Helm
# support - no Flux required. Flux (source-controller/helm-controller) was
# never installed on this cluster, so the original HelmRelease/HelmRepository
# approach (base/cmf-operator/helmrelease.yaml) could never actually apply.
# Chart version confirmed live against https://packages.confluent.io/helm -
# latest at time of writing is 2.4.1, not the originally assumed 1.2.0.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cmf-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://packages.confluent.io/helm
    chart: confluent-manager-for-apache-flink
    targetRevision: 2.4.1
    helm:
      values: |
        # Cut from 1Gi/2Gi - confirmed live that CMF isn't on the critical
        # path for actually running a Flink job in this environment (see
        # base/flink-jobs/flink-deployment.yaml's header comment: real jobs
        # go through the native flink-kubernetes-operator FlinkDeployment
        # CRD, not through CFK's FlinkApplication -> CMF path, which never
        # reconciles here). Freed to make room for the Flink job itself on
        # a memory-constrained node. Bump back up if CMF's REST API
        # (environment/catalog/database registration for Flink SQL) becomes
        # load-bearing.
        resources:
          requests:
            cpu: 500m
            memory: 640Mi
          limits:
            cpu: 1
            memory: 1Gi
        # Suppress the chart's hardcoded podSecurityContext (fsGroup: 1001,
        # runAsUser: 1001). On OpenShift, the restricted-v2 SCC assigns UIDs
        # from the namespace's allowed range at admission - fixed UIDs trip
        # SCC validation outright unless a custom SCC widens the range.
        podSecurity:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: cmf-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
