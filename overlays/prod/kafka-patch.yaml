apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: confluent
spec:
  replicas: 3
  podTemplate:
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app: kafka
    envVars:
      # Larger heap for production scale, still capped at 6g per Confluent's
      # guidance (heap rarely needs to exceed 6GB even on busy clusters).
      - name: KAFKA_HEAP_OPTS
        value: "-Xms6g -Xmx6g -XX:MetaspaceSize=96m -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35"
    resources:
      requests:
        cpu: 2
        memory: 8Gi
      limits:
        cpu: 4
        memory: 16Gi
  configOverrides:
    server:
      - default.replication.factor=3
      - min.insync.replicas=2
