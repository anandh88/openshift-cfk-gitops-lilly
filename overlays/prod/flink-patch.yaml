apiVersion: cmf.confluent.io/v1beta1
kind: FlinkApplication
metadata:
  name: statefarm-claims-processor
  namespace: flink-jobs
spec:
  jobSpec:
    parallelism: 3
  jobManager:
    resource:
      memory: 2048m
      cpu: 1
  taskManager:
    replicas: 3
    resource:
      memory: 2048m
      cpu: 2
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "2"
