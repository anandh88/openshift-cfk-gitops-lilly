apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: confluent
spec:
  # Scaled down from 3 to relieve CRC node CPU/memory pressure during bring-up.
  replicas: 1
  podTemplate:
    affinity: null
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2
        memory: 10Gi
