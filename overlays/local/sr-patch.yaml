apiVersion: platform.confluent.io/v1beta1
kind: SchemaRegistry
metadata:
  name: schemaregistry
  namespace: confluent
spec:
  replicas: 1
  podTemplate:
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # CRC's contended node made this pod's default liveness patience (~90s)
    # too tight, causing a full CrashLoopBackOff - same class of issue as
    # Connect's plugin-scan probe timeout. Widened for headroom.
    probe:
      liveness:
        initialDelaySeconds: 120
        failureThreshold: 30
      readiness:
        initialDelaySeconds: 120
        failureThreshold: 30
