apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/confluent-platform
  - ../../base/flink-jobs
patches:
  - path: kraft-patch.yaml
  - path: kafka-patch.yaml
  - path: sr-patch.yaml
  - path: connect-patch.yaml
  - path: flink-patch.yaml
images:
  - name: confluentinc/confluent-server
    newTag: "7.6.0"
  - name: confluentinc/cp-schema-registry
    newTag: "7.6.0"
  - name: confluentinc/cp-server-connect
    newTag: "7.6.0"
  - name: confluentinc/cp-kafka-rest
    newTag: "7.6.0"
  - name: confluentinc/cp-enterprise-control-center
    newTag: "7.6.0"
  - name: confluentinc/confluent-init-container
    newTag: "2.8.0"
commonAnnotations:
  deployment-environment: local-crc
