apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: connect
  namespace: confluent
spec:
  replicas: 1
  podTemplate:
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: 1
        memory: 2Gi
    # CRC's contended single node makes Connect's reflection-based plugin
    # scan take 30-90s per plugin dir (vs ms uncontended) - default liveness
    # patience (~12min) can be exceeded, killing the pod right before it
    # finishes and forcing a full re-scan. Widened to give it more headroom.
    probe:
      liveness:
        initialDelaySeconds: 300
        failureThreshold: 60
      readiness:
        initialDelaySeconds: 300
        failureThreshold: 60
