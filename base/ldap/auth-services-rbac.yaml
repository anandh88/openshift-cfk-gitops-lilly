# Shared service account for auth-services namespace workloads (LDAP + KDC).
# Matches the platform-rbac.yaml pattern: one ServiceAccount per namespace,
# a narrowly-scoped Role covering only what the pods actually touch.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-services-sa
  namespace: auth-services
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auth-services-role
  namespace: auth-services
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ldap-credentials"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auth-services-binding
  namespace: auth-services
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auth-services-role
subjects:
  - kind: ServiceAccount
    name: auth-services-sa
    namespace: auth-services
