# osixia/openldap:1.5.0, LDAP-backed Kerberos principal store for realm
# PSYNCOPATE.COM (see ldap-seed-configmap.yaml for the schema/structure it
# bootstraps). DISABLE_CHOWN=true lets the image skip its internal
# ownership-fixing step, which needs root - this is the documented way to
# run this image fully non-root, matching the rest of this repo's no-
# custom-SCC/restricted-v2 pattern (podSecurityContext below sets no fixed
# runAsUser/fsGroup, same as base/confluent-platform/*.yaml).
#
# LDAP_REMOVE_CONFIG_AFTER_SETUP=false: the image's default first-start
# cleanup does `rm -rf .../bootstrap` (the ConfigMap-mounted directory).
# Confirmed live: this doesn't just fail to delete the mount point - it
# recursively deletes the mounted files *first*, silently losing the seed
# LDIFs from the volume on next reference. Disabling this cleanup keeps the
# ConfigMap mount intact.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldap
  namespace: auth-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ldap
  template:
    metadata:
      labels:
        app: ldap
    spec:
      serviceAccountName: auth-services-sa
      # Kubernetes auto-injects Docker-links-style `<SERVICE>_PORT` env vars
      # into every pod for every reachable Service - since our own Service
      # is named "ldap", that means `LDAP_PORT=tcp://<clusterIP>:389` gets
      # injected automatically. osixia/openldap's entrypoint *also* uses an
      # env var literally named LDAP_PORT internally to build slapd's listen
      # URL, and the Kubernetes-injected value collides with and corrupts
      # it. Confirmed live: slapd failed with `listen URL
      # "ldap://<pod>:tcp://<ip>:389" parse error=5` - the k8s-injected
      # value got concatenated straight into the URL. enableServiceLinks:
      # false is the standard fix for this whole class of collision.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ldap
          image: osixia/openldap:1.5.0
          # No args. `--copy-service` is NOT a startup modifier - it's a
          # separate one-shot mode of this image's entrypoint that copies
          # service files and exits (confirmed live via --loglevel debug:
          # "Run commands before finish..." then "Killing all processes",
          # exit code 0, immediately - not the long-running slapd process at
          # all). The custom-bootstrap-ldif mount below works the same way
          # verified locally without this flag.
          ports:
            - name: ldap
              containerPort: 389
              protocol: TCP
          env:
            - name: LDAP_ORGANISATION
              value: "Psyncopate"
            - name: LDAP_DOMAIN
              value: "psyncopate.com"
            - name: LDAP_BASE_DN
              value: "dc=psyncopate,dc=com"
            - name: LDAP_TLS
              value: "false"
            - name: DISABLE_CHOWN
              value: "true"
            - name: LDAP_REMOVE_CONFIG_AFTER_SETUP
              value: "false"
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ldap-credentials
                  key: LDAP_ADMIN_PASSWORD
            - name: LDAP_CONFIG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ldap-credentials
                  key: LDAP_CONFIG_PASSWORD
          volumeMounts:
            - name: ldap-data
              mountPath: /var/lib/ldap
              subPath: data
            - name: ldap-data
              mountPath: /etc/ldap/slapd.d
              subPath: config
            - name: ldap-seed
              mountPath: /container/service/slapd/assets/config/bootstrap/ldif/custom
          securityContext:
            # Deliberately does NOT drop capabilities (unlike every other
            # container in this repo). Confirmed live: with
            # capabilities.drop:[ALL] set, this image's s6-overlay process
            # supervisor fails silently and near-instantly during its own
            # startup - no application-level log output at all, just
            # "Run commands before finish..." then exit 0 within the same
            # second. Removing the capabilities drop (keeping
            # allowPrivilegeEscalation: false) was the fix; DISABLE_CHOWN
            # above still means the app itself never needs root-only
            # capabilities like CAP_CHOWN once running.
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 389
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 389
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: ldap-data
          persistentVolumeClaim:
            claimName: ldap-data
        - name: ldap-seed
          configMap:
            name: ldap-seed
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ldap-data
  namespace: auth-services
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: crc-csi-hostpath-provisioner
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ldap
  namespace: auth-services
spec:
  selector:
    app: ldap
  ports:
    - name: ldap
      port: 389
      targetPort: 389
