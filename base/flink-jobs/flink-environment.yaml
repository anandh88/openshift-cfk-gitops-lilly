# kubernetesNamespace is the only required field on this CRD; Kafka
# connectivity for actual jobs is configured per-FlinkApplication (or via a
# separate FlinkKafkaCatalog/FlinkKafkaDatabase resource for Flink SQL use
# cases), not declared here as a kafkaClusters list like earlier CFK/CMF
# versions - that field doesn't exist on this CRD.
apiVersion: platform.confluent.io/v1beta1
kind: FlinkEnvironment
metadata:
  name: statefarm-flink-env
  namespace: flink-jobs
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  kubernetesNamespace: flink-jobs
  cmfRestClassRef:
    name: default
