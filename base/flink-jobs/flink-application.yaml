# Image is built from flink-jobs/claims-processor/ (Dockerfile + pom.xml) and
# pushed to this CRC instance's own internal registry - not ghcr.io/
# ci-flink-build.yaml's path, since that CI pipeline has never actually run
# (no GitHub Actions execution in this environment) and the ghcr.io image was
# never published. Rebuild with:
#   cd flink-jobs/claims-processor && mvn -q package -DskipTests
#   docker build --platform linux/amd64 -t claims-processor:local .
#   oc registry login  # or: docker login default-route-openshift-image-registry.apps-crc.testing
#   docker tag claims-processor:local default-route-openshift-image-registry.apps-crc.testing/flink-jobs/claims-processor:latest
#   docker push default-route-openshift-image-registry.apps-crc.testing/flink-jobs/claims-processor:latest
# ci-flink-build.yaml remains as the intended path once this repo is pushed
# somewhere with real GitHub Actions runs and a ghcr.io username to publish to.
#
# Rewritten against the actual CFK 3.3 FlinkApplication CRD schema, which
# differs substantially from the CMF-as-a-separate-product model originally
# assumed: flinkEnvironment is a plain string (not environment.name), job
# replaces jobSpec, serviceAccount replaces serviceAccountName, mode is
# native/standalone (Flink Kubernetes Operator's own terminology, not
# "Application"), and resource.memory must be a real memory quantity (Mi/Gi),
# not a CPU-style "m" suffix.
apiVersion: platform.confluent.io/v1beta1
kind: FlinkApplication
metadata:
  name: statefarm-claims-processor
  namespace: flink-jobs
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  cmfRestClassRef:
    name: default
  flinkEnvironment: statefarm-flink-env
  flinkVersion: "v1_19"
  mode: native
  image: ghcr.io/mkurre/flink-jobs/claims-processor:sha-093271a
  serviceAccount: flink-service-account
  job:
    jarURI: local:///opt/flink/usrlib/claims-processor.jar
    entryClass: com.statefarm.flink.ClaimsProcessorJob
    args:
      - --input-topic=raw-claims
      - --output-topic=processed-claims
    parallelism: 1
    upgradeMode: savepoint
  jobManager:
    resource:
      memory: 1024Mi
      cpu: 500m
  taskManager:
    replicas: 1
    resource:
      memory: 1024Mi
      cpu: 1
    podTemplate:
      spec:
        containers:
          - name: flink-main-container
            volumeMounts:
              - name: flink-kafka-sasl
                mountPath: /mnt/secrets/flink-kafka-sasl
                readOnly: true
              - name: kafka-ca
                mountPath: /mnt/kafka-ca
                readOnly: true
        volumes:
          - name: flink-kafka-sasl
            secret:
              secretName: flink-kafka-sasl
          - name: kafka-ca
            configMap:
              name: kafka-ca
  flinkConfiguration:
    state.backend: hashmap
    execution.checkpointing.interval: "60000"
    execution.checkpointing.mode: EXACTLY_ONCE
    taskmanager.numberOfTaskSlots: "1"
    rest.port: "8081"
    # Prerequisite for base/observability/grafana/dashboards/24-flink-mvp.json -
    # without this the job would run with zero Prometheus metrics exposed, same
    # as the jobmanager/CMF operator pods today. Port range (not a single port)
    # because every taskmanager replica needs its own listener.
    metrics.reporters: prom
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: "9249-9250"
