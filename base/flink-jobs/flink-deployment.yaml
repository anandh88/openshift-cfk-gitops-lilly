# Native Apache Flink Kubernetes Operator CRD - NOT CFK's platform.confluent.io/
# v1beta1 FlinkApplication (see flink-application.yaml, kept for reference/
# comparison but no longer relied on). Switched after finding a reference
# implementation (a real production GitOps repo, shared for lead-hunting on
# the CFK-never-reconciles-FlinkApplication gap) that deploys real Flink jobs
# exactly this way - CMF is used there only for SQL environment/catalog/
# database REST registration, never for running the job itself. That
# reference repo's own flink-job/README.md states outright: "Flink
# application mode... only accepts local:// JAR URIs" and uses this exact
# CRD (flink.apache.org/v1beta1 FlinkDeployment) reconciled directly by
# flink-kubernetes-operator - which is already running healthy in this
# cluster and was never the broken link; only CFK's own controller for its
# own FlinkApplication CRD was.
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: statefarm-claims-processor
  namespace: flink-jobs
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  image: image-registry.openshift-image-registry.svc:5000/flink-jobs/claims-processor:latest
  imagePullPolicy: Always
  flinkVersion: v1_19
  mode: native
  serviceAccount: flink-service-account
  flinkConfiguration:
    # Switched from hashmap so RocksDB metrics (data size, background
    # errors, write stalls) actually exist to dashboard - confirmed live
    # that zero rocksdb_* metrics are emitted under the hashmap backend.
    # RocksDB's own metrics are opt-in (disabled by default, each one adds
    # per-column-family scrape overhead) - explicitly enabling exactly the
    # ones asked for plus the memtable/compaction context needed to
    # interpret them.
    state.backend: rocksdb
    state.backend.rocksdb.metrics.estimate-live-data-size: "true"
    state.backend.rocksdb.metrics.live-sst-files-size: "true"
    state.backend.rocksdb.metrics.total-sst-files-size: "true"
    state.backend.rocksdb.metrics.background-errors: "true"
    state.backend.rocksdb.metrics.is-write-stopped: "true"
    state.backend.rocksdb.metrics.actual-delayed-write-rate: "true"
    state.backend.rocksdb.metrics.mem-table-flush-pending: "true"
    state.backend.rocksdb.metrics.compaction-pending: "true"
    state.backend.rocksdb.metrics.num-running-compactions: "true"
    state.backend.rocksdb.metrics.num-running-flushes: "true"
    state.backend.rocksdb.metrics.cur-size-active-mem-table: "true"
    state.backend.rocksdb.metrics.cur-size-all-mem-tables: "true"
    state.backend.rocksdb.metrics.block-cache-usage: "true"
    state.backend.rocksdb.metrics.block-cache-capacity: "true"
    execution.checkpointing.interval: "60000"
    execution.checkpointing.mode: EXACTLY_ONCE
    taskmanager.numberOfTaskSlots: "1"
    rest.port: "8081"
    metrics.reporters: prom
    # Confirmed live via the TaskManager's own "Available factories" list in
    # its startup WARN log - it's PrometheusReporterFactory, not
    # PrometheusReporter. Wrong class name here means the reporter is
    # silently skipped ("No metrics reporter configured"), not an error.
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: "9249-9250"
  # Console-only, dropping the image's default RollingFileAppender. Confirmed
  # live: that appender can't write to /opt/flink/log/ under OpenShift's
  # restricted-v2 SCC (arbitrary non-root UID doesn't own that directory),
  # and the resulting IllegalStateException during log4j's own startup
  # cascades into aborting ReporterSetup.loadAvailableReporterFactories
  # entirely (it hits a broken logger context while probing the bundled
  # Datadog reporter's static initializer) - so the Prometheus reporter
  # never got created either, despite the config above being fine. Same
  # content as the image's own log4j-console.properties minus the
  # rolling-file appender and its rootLogger reference.
  logConfiguration:
    log4j-console.properties: |
      rootLogger.level = INFO
      rootLogger.appenderRef.console.ref = ConsoleAppender
      appender.console.name = ConsoleAppender
      appender.console.type = CONSOLE
      appender.console.layout.type = PatternLayout
      appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
      logger.akka.name = akka
      logger.akka.level = INFO
      logger.kafka.name = org.apache.kafka
      logger.kafka.level = INFO
      logger.hadoop.name = org.apache.hadoop
      logger.hadoop.level = INFO
      logger.zookeeper.name = org.apache.zookeeper
      logger.zookeeper.level = INFO
      logger.netty.name = org.apache.flink.shaded.akka.org.jboss.netty.channel.DefaultChannelPipeline
      logger.netty.level = OFF
  job:
    jarURI: local:///opt/flink/usrlib/claims-processor.jar
    entryClass: com.statefarm.flink.ClaimsProcessorJob
    args:
      - --input-topic=raw-claims
      - --output-topic=processed-claims
    parallelism: 1
    upgradeMode: stateless
  # Shared by both JobManager and TaskManager - required on both, not just
  # TaskManager. In Application Mode the job's main() (which builds the
  # KafkaSource/KafkaSink and reads flink-kafka-sasl/kafka-ca itself) runs on
  # the JobManager, not just the TaskManager - confirmed live, the JobManager
  # crashed with NoSuchFileException on /mnt/secrets/flink-kafka-sasl/plain.txt
  # the first time this was scoped to taskManager.podTemplate only.
  podTemplate:
    spec:
      containers:
        - name: flink-main-container
          # PodMonitor requires the port to be declared here - Prometheus
          # drops any target whose port isn't in the Pod spec, even if
          # something really is listening on it.
          ports:
            - name: metrics
              containerPort: 9249
              protocol: TCP
          volumeMounts:
            - name: flink-kafka-sasl
              mountPath: /mnt/secrets/flink-kafka-sasl
              readOnly: true
            - name: kafka-ca
              mountPath: /mnt/kafka-ca
              readOnly: true
      volumes:
        - name: flink-kafka-sasl
          secret:
            secretName: flink-kafka-sasl
        - name: kafka-ca
          configMap:
            name: kafka-ca
  # Asymmetric on purpose. JobManager's memory model is simple (Heap +
  # Off-heap, off-heap floor 128mb) - 640m clears it (640 - 256 jvm-metaspace
  # - 192 jvm-overhead = 192mb Flink Memory > 128mb floor). TaskManager's
  # model sums more categories (framework heap/off-heap + managed + network
  # = 448mb by default) - confirmed live 768m fails here (only 320mb Flink
  # Memory available, < 448mb needed); 1024m clears it (576mb available).
  # Both confirmed by IllegalConfigurationException on under-sized attempts.
  jobManager:
    resource:
      memory: 640m
      cpu: 0.5
  taskManager:
    replicas: 1
    resource:
      memory: 1024m
      cpu: 1
