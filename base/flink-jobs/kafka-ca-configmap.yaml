# Public CA cert only (no private key) - copied from confluent/kafka-tls-secret's
# ca.crt so the Flink job's plain Kafka client (not a CFK-managed component,
# so it doesn't get truststore wiring automatically like Connect/SchemaRegistry/
# RestProxy do) can trust the broker's TLS cert on the internal SASL_SSL
# listener (kafka.confluent.svc.cluster.local:9071). PEM format, mounted
# directly as ssl.truststore.location with ssl.truststore.type=PEM (KIP-651) -
# no keytool/JKS conversion needed, unlike connect-truststore-configmap.yaml's
# older JKS approach. Re-copy this if kafka-tls-secret's CA ever rotates
# (valid until 2036-08-02 as of writing).
