# Self-contained RBAC for the flink-jobs namespace (mirrors the
# flink-* resources defined in bootstrap/platform-rbac.yaml so this
# kustomization can be applied standalone).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink-service-account
  namespace: flink-jobs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink-role
  namespace: flink-jobs
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "events"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["flink-kafka-sasl"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    # Separate K8s RBAC subresource, NOT covered by the "deployments" rule
    # above even with verbs: ["*"] on the resource. Confirmed live: the
    # JobManager (using this ServiceAccount's in-cluster client) failed to
    # create the TaskManager pod with "cannot set blockOwnerDeletion if an
    # ownerReference refers to a resource you can't set finalizers on" -
    # setting blockOwnerDeletion: true on a child's ownerReference requires
    # update on the parent kind's /finalizers subresource specifically.
    resources: ["deployments/finalizers"]
    verbs: ["update"]
  - apiGroups: ["platform.confluent.io"]
    resources: ["flinkapplications", "flinkenvironments"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink-binding
  namespace: flink-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flink-role
subjects:
  - kind: ServiceAccount
    name: flink-service-account
    namespace: flink-jobs
