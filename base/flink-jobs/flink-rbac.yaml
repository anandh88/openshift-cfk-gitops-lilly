# Self-contained RBAC for the flink-jobs namespace (mirrors the
# flink-* resources defined in bootstrap/platform-rbac.yaml so this
# kustomization can be applied standalone).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink-service-account
  namespace: flink-jobs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink-role
  namespace: flink-jobs
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "events"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["flink-kafka-sasl"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["*"]
  - apiGroups: ["cmf.confluent.io"]
    resources: ["flinkapplications", "flinkenvironments"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink-binding
  namespace: flink-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flink-role
subjects:
  - kind: ServiceAccount
    name: flink-service-account
    namespace: flink-jobs
