# Placeholder: encrypts a structurally-valid but empty keytab (just the
# 2-byte MIT keytab format-version magic, 0x0502 - confirmed klist reads it
# as a valid keytab with zero entries). scripts/kerberos/04-seal-keytabs.sh
# overwrites this file with the real MSSQLSvc/... keytab once
# scripts/kerberos/03-export-keytabs.sh has extracted it from the KDC.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sqlserver-keytab
  namespace: sqlserver
spec:
  encryptedData:
    mssql.keytab: 
  template:
    metadata:
      name: sqlserver-keytab
      namespace: sqlserver
    type: Opaque
