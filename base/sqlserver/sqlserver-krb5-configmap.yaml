# Client-only krb5.conf for the sqlserver namespace (no [dbmodules] - this
# namespace only ever talks to the KDC as a Kerberos client/service, never
# to LDAP directly). ConfigMaps are namespace-scoped so this is a
# necessary duplicate of base/kerberos/krb5-configmap.yaml's [libdefaults]/
# [realms]/[domain_realm] sections, not a copy-paste mistake.
#
# udp_preference_limit = 0: per Microsoft's own AD-authentication tutorial
# (learn.microsoft.com/sql/linux/security/authentication/active-directory-tutorial),
# recommended when the SQL Server host has no real SSSD/realmd domain-join
# (true here - see MSSQL_NETWORK_DISABLESSSD in sqlserver-deployment.yaml)
# to skip UDP calls to the KDC, which fail intermittently in containerized/
# NAT'd networks.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sqlserver-krb5-conf
  namespace: sqlserver
data:
  krb5.conf: |
    [libdefaults]
        default_realm = PSYNCOPATE.COM
        dns_lookup_realm = false
        dns_lookup_kdc = false
        udp_preference_limit = 0
        rdns = false

    [realms]
        PSYNCOPATE.COM = {
            kdc = kdc.auth-services.svc.cluster.local:88
            admin_server = kdc.auth-services.svc.cluster.local:749
        }

    [domain_realm]
        .psyncopate.com = PSYNCOPATE.COM
        psyncopate.com = PSYNCOPATE.COM
        .sqlserver.svc.cluster.local = PSYNCOPATE.COM
