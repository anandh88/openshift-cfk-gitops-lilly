# Demo schema for the JDBC Source Connector to poll: a ClaimsDB.Claims
# table with both an incrementing PK (ClaimId) and a timestamp column
# (UpdatedAt), so the connector can run in timestamp+incrementing mode.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sqlserver-init
  namespace: sqlserver
data:
  init.sql: |
    IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = 'ClaimsDB')
    BEGIN
        CREATE DATABASE ClaimsDB;
    END
    GO

    USE ClaimsDB;
    GO

    IF NOT EXISTS (SELECT * FROM sys.tables WHERE name = 'Claims')
    BEGIN
        CREATE TABLE Claims (
            ClaimId INT IDENTITY(1,1) PRIMARY KEY,
            PolicyNumber NVARCHAR(50) NOT NULL,
            ClaimAmount DECIMAL(12,2) NOT NULL,
            ClaimStatus NVARCHAR(20) NOT NULL DEFAULT 'OPEN',
            CreatedAt DATETIME2 NOT NULL DEFAULT SYSUTCDATETIME(),
            UpdatedAt DATETIME2 NOT NULL DEFAULT SYSUTCDATETIME()
        );
    END
    GO

    IF NOT EXISTS (SELECT * FROM Claims)
    BEGIN
        INSERT INTO Claims (PolicyNumber, ClaimAmount, ClaimStatus)
        VALUES ('POL-1001', 2500.00, 'OPEN'),
               ('POL-1002', 875.50, 'OPEN'),
               ('POL-1003', 12000.00, 'UNDER_REVIEW');
    END
    GO
