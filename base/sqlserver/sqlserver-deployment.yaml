# SQL Server 2022 Express, Kerberos-enabled via the mssql-conf network.*
# settings (confirmed against Microsoft's own AD-authentication tutorial:
# learn.microsoft.com/sql/linux/security/authentication/active-directory-tutorial).
# Those mssql-conf keys are also settable as MSSQL_<SECTION>_<KEY>
# environment variables, which is what's used below instead of a `mssql-conf
# set` exec step:
#   network.kerberoskeytabfile   -> MSSQL_NETWORK_KERBEROSKEYTABFILE
#   network.disablesssd          -> MSSQL_NETWORK_DISABLESSSD
#   network.privilegedadaccount  -> MSSQL_NETWORK_PRIVILEGEDADACCOUNT
#
# MSSQL_NETWORK_DISABLESSSD=true is required here specifically because this
# container was never joined to a domain via SSSD/realmd - without it, SQL
# Server tries SSSD first and only falls back to direct OpenLDAP/Kerberos
# calls after that fails, per the same tutorial's guidance for non-SSSD
# hosts.
#
# This cluster's node is arm64; mssql/server:2022 is amd64-only and runs
# via QEMU user-mode emulation (binfmt_misc registered on the node - see
# docs/kerberos-architecture.md). On real amd64 hardware, Microsoft's image
# is documented to run fine under an OpenShift-assigned arbitrary non-root
# UID (restricted-v2) as long as fsGroup grants write access to
# /var/opt/mssql - the no-custom-SCC pattern used everywhere else in this
# repo.
#
# On THIS arm64 node, that pattern breaks: confirmed live that QEMU's
# emulation of the sqlservr binary segfaults immediately under
# restricted-v2's forced capabilities.drop:[ALL] (the exact same failure
# class as osixia/openldap's s6-overlay in base/ldap/ldap-deployment.yaml -
# both need capabilities restricted-v2 cannot grant, since it only allows
# adding back NET_BIND_SERVICE). No pod-level runAsNonRoot here, same fix
# as ldap - see bootstrap/auth-services-scc.yaml for the anyuid binding
# this depends on.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
  namespace: sqlserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      serviceAccountName: sqlserver-sa
      enableServiceLinks: false
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - name: tds
              containerPort: 1433
              protocol: TCP
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: "Express"
            - name: MSSQL_TCP_PORT
              value: "1433"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sqlserver-credentials
                  key: MSSQL_SA_PASSWORD
            - name: MSSQL_NETWORK_KERBEROSKEYTABFILE
              value: "/var/opt/mssql/secrets/mssql.keytab"
            - name: MSSQL_NETWORK_DISABLESSSD
              value: "true"
            - name: MSSQL_NETWORK_PRIVILEGEDADACCOUNT
              value: "sqlservice"
            - name: KRB5_CONFIG
              value: "/etc/krb5.conf"
          volumeMounts:
            - name: sqlserver-data
              mountPath: /var/opt/mssql
            - name: krb5-conf
              mountPath: /etc/krb5.conf
              subPath: krb5.conf
            - name: sqlserver-keytab
              mountPath: /var/opt/mssql/secrets
              readOnly: true
          # No capabilities drop - see the file header comment. Confirmed
          # live: QEMU's user-mode emulation of sqlservr segfaults
          # immediately under capabilities.drop:[ALL].
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2
              memory: 4Gi
          readinessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: sqlserver-data
          persistentVolumeClaim:
            claimName: sqlserver-data
        - name: krb5-conf
          configMap:
            name: sqlserver-krb5-conf
        - name: sqlserver-keytab
          secret:
            secretName: sqlserver-keytab
            defaultMode: 0440
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sqlserver-data
  namespace: sqlserver
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: crc-csi-hostpath-provisioner
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sqlserver
  namespace: sqlserver
spec:
  selector:
    app: sqlserver
  ports:
    - name: tds
      port: 1433
      targetPort: 1433
---
# One-time schema init: waits for SQL Server to accept SA connections, then
# applies sqlserver-init-configmap.yaml via sqlcmd. Uses SA/password auth
# (not Kerberos) deliberately - this is an internal bootstrap step, kept
# independent of the Kerberos keytab chain the JDBC connector uses later.
apiVersion: batch/v1
kind: Job
metadata:
  name: sqlserver-init
  namespace: sqlserver
  annotations:
    # PostSync already guarantees this runs after every non-hook resource in
    # this Application (including the sqlserver Deployment above) has synced
    # and reported healthy - no sync-wave annotation needed on top of that.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: sqlserver-sa
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sqlserver-init
          image: mcr.microsoft.com/mssql-tools18/mssql-tools18:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eu
              for i in $(seq 1 30); do
                if /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver.sqlserver.svc.cluster.local -U sa -P "$MSSQL_SA_PASSWORD" -Q "SELECT 1" >/dev/null 2>&1; then
                  echo "SQL Server is ready"
                  break
                fi
                echo "Waiting for SQL Server... ($i/30)"
                sleep 10
              done
              /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver.sqlserver.svc.cluster.local -U sa -P "$MSSQL_SA_PASSWORD" -i /init/init.sql
          env:
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sqlserver-credentials
                  key: MSSQL_SA_PASSWORD
          volumeMounts:
            - name: init-sql
              mountPath: /init
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: init-sql
          configMap:
            name: sqlserver-init
