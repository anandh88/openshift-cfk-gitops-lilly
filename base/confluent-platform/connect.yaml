apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: connect
  namespace: confluent
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: 1
  image:
    application: confluentinc/cp-server-connect:7.6.0
    init: confluentinc/confluent-init-container:2.8.0
  tls:
    secretRef: connect-tls-secret
  externalAccess:
    type: route
    route:
      domain: apps-crc.testing
  dependencies:
    kafka:
      bootstrapEndpoint: kafka:9092
      authentication:
        type: plain
        jaasConfig:
          secretRef: kafka-internal-sasl
      tls:
        enabled: true
        secretRef: kafka-tls-secret
    schemaRegistry:
      url: https://schemaregistry.confluent.svc.cluster.local:8081
      tls:
        enabled: true
        secretRef: schemaregistry-tls-secret
  podTemplate:
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: 1
        memory: 2Gi
  configOverrides:
    server:
      - config.storage.replication.factor=1
      - offset.storage.replication.factor=1
      - status.storage.replication.factor=1
