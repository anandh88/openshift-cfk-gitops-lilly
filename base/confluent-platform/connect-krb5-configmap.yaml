# Client-only krb5.conf for Kafka Connect's JDBC Source Connector to
# authenticate to SQL Server via Kerberos/SPNEGO. Mounted into the Connect
# CR via connect-kerberos-patch.yaml's mountedVolumes (the Connect CRD has
# no podTemplate.volumes field - only mountedSecrets/mountedVolumes at the
# top level of spec, confirmed against the live CRD schema:
# `oc get crd connects.platform.confluent.io -o jsonpath=...spec.podTemplate.properties`).
#
# Points at the Samba AD DC running in Docker Desktop, alongside SQL
# Server - not an in-cluster Service. SQL Server's login-mapping (sssd's
# ad provider) needs a real AD domain controller reachable over full
# TCP+UDP (CLDAP pings, DNS SRV records) to trust a domain at all; that
# only works reliably when the DC and SQL Server share a real network
# (Docker Desktop's bridge), not tunneled - confirmed live that an
# in-cluster AD DC hit an unresolvable UDP wall (ssh -L/-R can't carry
# UDP) for exactly that traffic. Connect's own traffic to the DC (this
# config) only ever needs Kerberos AS-REQ/TGS-REQ, which is TCP-only and
# tunnels fine - same reverse-tunnel mechanism already used for SQL
# Server's own TDS traffic (see docs/kerberos-architecture.md), just a
# second `-R` forwarding the DC's port 88 instead of SQL Server's 1433.
# admin_server here is Samba's kpasswd port (464), not a kadmin protocol
# port (749) - Samba has no kadmin service, administration goes through
# LDAP/samba-tool instead - but this client only ever does AS-REQ/TGS-REQ,
# never a password change, so admin_server is unused in practice either way.
#
# udp_preference_limit=1 alone isn't enough to stop Java from attempting
# UDP first anyway (confirmed live - a real JDK quirk, not a config
# mistake), and there's nothing listening on UDP 18088 on the node since
# the tunnel is TCP-only - that gets an instant ICMP "port unreachable",
# which Java treats as fatal instead of falling back to TCP. Making the
# node silently DROP that UDP traffic instead (scripts/kerberos/
# 07-setup-connect-tunnel.sh) turns it into an ordinary timeout, which
# *does* trigger Java's normal TCP fallback.
apiVersion: v1
kind: ConfigMap
metadata:
  name: connect-krb5-conf
  namespace: confluent
data:
  krb5.conf: |
    [libdefaults]
        default_realm = PSYNCOPATE.COM
        dns_lookup_realm = false
        dns_lookup_kdc = false
        udp_preference_limit = 1
        rdns = false

    [realms]
        PSYNCOPATE.COM = {
            kdc = 192.168.126.11:18088
            admin_server = 192.168.126.11:18088
        }

    [domain_realm]
        .psyncopate.com = PSYNCOPATE.COM
        psyncopate.com = PSYNCOPATE.COM
        .confluent.svc.cluster.local = PSYNCOPATE.COM
