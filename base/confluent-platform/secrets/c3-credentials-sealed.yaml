# Run scripts/seal-secrets.sh to generate real sealed values.
# Never commit plain Kubernetes Secret objects to this repo.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: c3-credentials
  namespace: confluent
spec:
  encryptedData:
    bearer.txt: REPLACE_WITH_OUTPUT_OF_seal-secrets.sh
  template:
    metadata:
      name: c3-credentials
      namespace: confluent
    type: Opaque
