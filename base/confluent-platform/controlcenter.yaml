# Control Center Next Gen (Confluent Platform 8.0+): C3 is now shipped and
# versioned independently of the core CP release train (confluent-control-center-next-gen,
# currently 2.5.0), and requires its own Prometheus + Alertmanager sidecars for
# metrics/alerting instead of relying solely on the Kafka metrics reporter topic.
# All three images (control-center-next-gen, prometheus, alertmanager) must share
# the same tag.
apiVersion: platform.confluent.io/v1beta1
kind: ControlCenter
metadata:
  name: controlcenter
  namespace: confluent
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  image:
    application: confluentinc/cp-enterprise-control-center-next-gen:2.5.0
    init: confluentinc/confluent-init-container:3.3.0
  dataVolumeCapacity: 5Gi
  storageClass:
    name: crc-csi-hostpath-provisioner
  tls:
    secretRef: controlcenter-tls-secret
  externalAccess:
    type: route
    route:
      domain: apps-crc.testing
  dependencies:
    kafka:
      bootstrapEndpoint: kafka:9071
      authentication:
        type: plain
        jaasConfig:
          secretRef: kafka-internal-sasl
      tls:
        enabled: true
        secretRef: kafka-tls-secret
    schemaRegistry:
      url: https://schemaregistry.confluent.svc.cluster.local:8081
      authentication:
        type: basic
        basic:
          secretRef: c3-credentials
      tls:
        enabled: true
        secretRef: schemaregistry-tls-secret
    connect:
      - name: connect
        url: https://connect.confluent.svc.cluster.local:8083
        authentication:
          type: basic
          basic:
            secretRef: c3-credentials
        tls:
          enabled: true
          secretRef: connect-tls-secret
    prometheusClient:
      url: http://controlcenter-prometheus.confluent.svc.cluster.local:9090
    alertManagerClient:
      url: http://controlcenter-alertmanager.confluent.svc.cluster.local:9093
  services:
    prometheus:
      image: confluentinc/cp-enterprise-prometheus:2.5.0
      pvc:
        dataVolumeCapacity: 5Gi
        storageClass:
          name: crc-csi-hostpath-provisioner
    alertmanager:
      image: confluentinc/cp-enterprise-alertmanager:2.5.0
  podTemplate:
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: 1
        memory: 2Gi
  configOverrides:
    server:
      - confluent.metrics.topic.max.retention.ms=259200000
      - confluent.controlcenter.internal.topics.replication=1
      - confluent.controlcenter.command.topic.replication=1
---
# CFK's generated controlcenter.properties hardcodes the prometheus/alertmanager
# URLs to <name>-prometheus/<name>-alertmanager regardless of the
# prometheusClient/alertManagerClient.url values above - these aliases give
# those hostnames somewhere real to resolve to, since both sidecars actually
# run as extra containers in the same controlcenter-0 pod/service.
apiVersion: v1
kind: Service
metadata:
  name: controlcenter-prometheus
  namespace: confluent
spec:
  selector:
    app: controlcenter
    clusterId: confluent
    confluent-platform: "true"
    type: controlcenter
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: controlcenter-alertmanager
  namespace: confluent
spec:
  selector:
    app: controlcenter
    clusterId: confluent
    confluent-platform: "true"
    type: controlcenter
  ports:
    - protocol: TCP
      port: 9093
      targetPort: 9093
