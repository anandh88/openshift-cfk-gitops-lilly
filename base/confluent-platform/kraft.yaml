apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: confluent
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  image:
    application: confluentinc/cp-server:8.2.2
    init: confluentinc/confluent-init-container:3.3.0
  dataVolumeCapacity: 5Gi
  storageClass:
    name: crc-csi-hostpath-provisioner
  tls:
    secretRef: kafka-tls-secret
  dependencies:
    # Same fix as kafka.yaml - lets the controller push its own metrics to
    # Control Center next-gen's embedded (push-only) Prometheus.
    metricsClient:
      url: http://controlcenter-prometheus.confluent.svc.cluster.local:9090
  podTemplate:
    serviceAccountName: kafka-sa
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 5Gi
