# Shared service account for auth-services namespace workloads (Samba AD
# DC). Same name/shape as the old LDAP+KDC RBAC it replaces - kept as
# auth-services-sa so bootstrap/auth-services-scc.yaml's existing anyuid
# binding for this SA needs no changes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-services-sa
  namespace: auth-services
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auth-services-role
  namespace: auth-services
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["samba-ad-credentials"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auth-services-binding
  namespace: auth-services
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auth-services-role
subjects:
  - kind: ServiceAccount
    name: auth-services-sa
    namespace: auth-services
