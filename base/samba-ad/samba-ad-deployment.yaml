# Samba4 Active Directory Domain Controller for realm/domain PSYNCOPATE.COM
# / PSYNCOPATE, replacing the old OpenLDAP + MIT krb5-kdc pair
# (base/ldap/, base/kerberos/'s KDC half).
#
# Why: SQL Server on Linux's "integrated security" (Kerberos) login path
# doesn't just validate the GSSAPI ticket cryptographically - it also calls
# into the OS identity stack (NSS, via sssd's ad provider) to resolve the
# client principal to a trusted domain account. sssd's ad provider only
# speaks to a real AD-schema directory, not a generic LDAP+MIT-KDC pair -
# confirmed live: MIT KDC + OpenLDAP got a valid Kerberos ticket all the way
# to SQL Server (GSSAPI accepted it, proving the keytab/SPN wiring was
# correct), but SQL Server then rejected the login with "the login is from
# an untrusted domain", because there was no AD for it to trust. Samba's AD
# DC mode implements the real AD LDAP schema, DNS SPN conventions, and
# Kerberos KDC together, which is what makes domain-join (and therefore
# that trust check) actually work.
#
# No maintained public image ships samba-ad-dc pre-installed and configured
# for an arbitrary realm, so - matching this repo's existing kdc-deployment
# pattern - this installs Debian's samba/samba-common-bin/krb5-user/winbind
# packages at container startup on top of debian:12-slim, then either
# provisions a fresh domain (first boot) or restores the persisted config
# and starts the `samba` binary (its own built-in AD DC process, which
# internally runs the LDAP server, KDC, DNS stub, and SMB/RPC services -
# there's no separate slapd/krb5kdc to run alongside it).
#
# Runs as root, same justification as the old kdc-deployment.yaml: apt-get/
# dpkg post-install scripts need real root capabilities, and `samba` itself
# needs to bind ports <1024 (88, 389, 445, 464). Bound to the built-in
# anyuid SCC via bootstrap/auth-services-scc.yaml (auth-services-sa only).
#
# --dns-backend=NONE: this domain has no DNS-based discovery anywhere in
# this repo (every krb5.conf/smb.conf that talks to it uses an explicit
# server address, dns_lookup_kdc=false - same pattern the old KDC used).
# Running Samba's internal DNS server would be one more moving part with no
# consumer, so it's turned off entirely rather than left unused.
#
# --host-name=SAMBADC1: explicit, not derived from the pod's own hostname.
# Deployment pods get a new random-suffixed hostname on every reschedule -
# letting samba-tool auto-derive the DC's NetBIOS/DNS identity from that
# would only matter at first-provision time (the chosen name is then baked
# into the AD database on the PVC forever), but pinning it explicitly here
# means a first provision after a PVC wipe always produces the same
# identity rather than whatever pod name happened to exist at that moment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: samba-ad
  namespace: auth-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: samba-ad
  template:
    metadata:
      labels:
        app: samba-ad
    spec:
      serviceAccountName: auth-services-sa
      enableServiceLinks: false
      securityContext: {}
      containers:
        - name: samba-ad
          image: debian:12-slim
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq samba samba-common-bin krb5-user winbind smbclient ldb-tools

              mkdir -p /var/lib/samba
              if [ ! -f /var/lib/samba/private/sam.ldb ]; then
                echo "==> No existing domain on the PVC - provisioning PSYNCOPATE.COM"
                rm -f /etc/samba/smb.conf
                # --option="vfs objects=...xattr_tdb": confirmed live that
                # provisioning otherwise fails setting the sysvol NT ACL -
                # writing the security.NTACL xattr needs CAP_SYS_ADMIN,
                # which this pod doesn't have (and won't be granted - it'd
                # need a broader SCC than anyuid for every workload here).
                # xattr_tdb emulates the same ACL storage inside a Samba-
                # managed tdb file instead of real filesystem xattrs,
                # sidestepping the capability requirement entirely - this
                # is Samba's own documented workaround for exactly this
                # class of restricted environment.
                samba-tool domain provision \
                  --use-rfc2307 \
                  --realm=PSYNCOPATE.COM \
                  --domain=PSYNCOPATE \
                  --server-role=dc \
                  --dns-backend=NONE \
                  --host-name=SAMBADC1 \
                  --option="vfs objects = dfs_samba4 acl_xattr xattr_tdb" \
                  --adminpass="${SAMBA_ADMIN_PASSWORD}"
                cp /etc/samba/smb.conf /var/lib/samba/smb.conf.persisted
              else
                echo "==> Existing domain found on the PVC - restoring config"
                cp /var/lib/samba/smb.conf.persisted /etc/samba/smb.conf
              fi

              # samba-tool's own generated /var/lib/samba/private/krb5.conf
              # sets dns_lookup_kdc=true, relying on DNS SRV records this
              # domain doesn't have (--dns-backend=NONE, same no-DNS
              # pattern as the rest of this repo) - confirmed live that
              # kinit fails ("Cannot find KDC for realm") against that
              # generated file. This one points explicitly at the DC's own
              # loopback instead, same style as the old krb5-configmap.yaml.
              cat > /etc/krb5.conf <<KRB5EOF
              [libdefaults]
                  default_realm = PSYNCOPATE.COM
                  dns_lookup_realm = false
                  dns_lookup_kdc = false
                  udp_preference_limit = 1

              [realms]
                  PSYNCOPATE.COM = {
                      kdc = 127.0.0.1:88
                      admin_server = 127.0.0.1:464
                      default_domain = psyncopate.com
                  }

              [domain_realm]
                  .psyncopate.com = PSYNCOPATE.COM
                  psyncopate.com = PSYNCOPATE.COM
              KRB5EOF

              echo "==> Starting samba (AD DC mode)"
              exec samba -i --debug-stdout
          env:
            - name: SAMBA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: samba-ad-credentials
                  key: SAMBA_ADMIN_PASSWORD
          ports:
            - name: kerberos
              containerPort: 88
              protocol: TCP
            - name: ldap
              containerPort: 389
              protocol: TCP
            - name: smb
              containerPort: 445
              protocol: TCP
            - name: kpasswd
              containerPort: 464
              protocol: TCP
          volumeMounts:
            - name: samba-data
              mountPath: /var/lib/samba
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 389
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 389
            initialDelaySeconds: 120
            periodSeconds: 20
      volumes:
        - name: samba-data
          persistentVolumeClaim:
            claimName: samba-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: samba-data
  namespace: auth-services
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: crc-csi-hostpath-provisioner
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: samba-ad
  namespace: auth-services
spec:
  selector:
    app: samba-ad
  ports:
    - name: kerberos
      port: 88
      protocol: TCP
      targetPort: 88
    - name: ldap
      port: 389
      protocol: TCP
      targetPort: 389
    - name: smb
      port: 445
      protocol: TCP
      targetPort: 445
    - name: kpasswd
      port: 464
      protocol: TCP
      targetPort: 464
