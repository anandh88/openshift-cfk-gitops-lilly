# See kafka-servicemonitor.yaml for the full rationale - same port 7778
# JMX-Prometheus-exporter endpoint, confirmed live on connect-0. This is the
# same connect-0 pod running the Kerberos JDBC Source Connector - scraping
# it is read-only and does not touch the connector's config or auth path.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: connect
  namespace: monitoring
  labels:
    release: observability
spec:
  namespaceSelector:
    matchNames:
      - confluent
  selector:
    matchLabels:
      type: connect
  endpoints:
    - port: prometheus
      path: /metrics
      interval: 30s
      scrapeTimeout: 15s
