apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-dashboard-01-platform-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  01-platform-overview.json: |
    {
      "uid": "platform-overview",
      "title": "01 - Confluent Component Operations",
      "description": "Dashboard 2 of 3 (Platform -> Component -> Workload). Golden-signal index across every Confluent/Flink component, each row backed by real metrics verified live against this cluster's Prometheus. Deep-dive panel-level detail lives in the linked per-component dashboards (02, 08, 10, 23, 24) rather than being duplicated here - a single dashboard covering Kafka+KRaft+Connect+SR+C3+RestProxy+Flink in full depth would violate the 'no 100 series on one chart' / 'no redundant graphs' guidance this build follows.",
      "tags": [
        "platform",
        "confluent",
        "dashboard-2"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "collapsed": false,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": [],
          "title": "Drill-down",
          "type": "row"
        },
        {
          "title": "Deep-dive dashboards",
          "type": "text",
          "options": {
            "mode": "markdown",
            "content": "[<- Dashboard 1: CFK Platform / Kubernetes Operations](/d/cfk-platform-operations)\n\n[02 - Kafka Platform (KRaft + Brokers + Topics) - full deep dive](/d/kafka-platform-kraft)\n\n[08 - Connect Platform - full deep dive](/d/connect-platform)\n\n[10 - Schema Registry - full deep dive](/d/schema-registry)\n\n[23 - JVM Deep Dive (cross-component)](/d/jvm-deep-dive)\n\n[24 - Flink - full deep dive (checkpoints, backpressure, skew, RocksDB)](/d/flink-mvp)\n\n[Dashboard 3: Streaming Workload Operations ->](/d/streaming-workload-operations)"
          },
          "description": "This dashboard is the golden-signal index across every Confluent/Flink component. Each row below links to the full deep-dive dashboard for that component.",
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "id": 2,
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 24,
            "h": 5
          }
        },
        {
          "collapsed": false,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "id": 3,
          "panels": [],
          "title": "Kafka",
          "type": "row"
        },
        {
          "title": "Brokers Up",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(up{job=\"kafka\"} == 1)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "WHAT: Kafka broker pods currently scrapeable.\nWHY: The most basic cluster-health signal.\nNORMAL: 3 (this deployment runs 3 brokers)\nPROBLEM: < 3\nNEXT: 02 - Kafka Platform dashboard.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "id": 4,
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 4,
            "h": 4
          }
        },
        {
          "title": "Active Controllers",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kafka_controller_kafkacontroller_value{name=\"ActiveControllerCount\"})",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 2
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "WHAT: KRaft active controller count.\nWHY: Exactly one controller must be active for the metadata quorum to make progress.\nNORMAL: 1\nPROBLEM: 0 or >1\nNEXT: 02 - Kafka Platform -> KRaft Controller row.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "id": 5,
          "gridPos": {
            "x": 4,
            "y": 7,
            "w": 4,
            "h": 4
          }
        },
        {
          "title": "Offline Partitions",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kafka_controller_kafkacontroller_value{name=\"OfflinePartitionsCount\"})",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "WHAT: Partitions with no leader.\nWHY: Producers/consumers for that partition are fully blocked.\nNORMAL: 0\nPROBLEM: > 0\nNEXT: 02 - Kafka Platform -> Platform Health row.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "id": 6,
          "gridPos": {
            "x": 8,
            "y": 7,
            "w": 4,
            "h": 4
          }
        },
        {
          "title": "Under-Replicated Partitions",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kafka_server_replicamanager_value{name=\"UnderReplicatedPartitions\"})",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "WHAT: Partitions whose replicas are not fully synchronized.\nWHY: Indicates broker failure, disk/network saturation, or replica recovery in progress.\nNORMAL: 0\nPROBLEM: Sustained > 0\nNEXT: 02 - Kafka Platform -> broker CPU/disk/network panels.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "id": 7,
          "gridPos": {
            "x": 12,
            "y": 7,
            "w": 4,
            "h": 4
          }
        },
        {
          "title": "Cluster throughput (bytes/sec)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(kafka_server_brokertopicmetrics_count{name=\"BytesInPerSec\"}[5m]))",
              "refId": "A",
              "legendFormat": "bytes in"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(kafka_server_brokertopicmetrics_count{name=\"BytesOutPerSec\"}[5m]))",
              "refId": "B",
              "legendFormat": "bytes out"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {}
            },
            "overrides": []
          },
          "description": "WHAT: Cluster-wide produce/fetch byte rate.\nWHY: Traffic golden signal for Kafka.\nNORMAL: Matches expected workload volume\nPROBLEM: Unexpected drop to zero or spike\nNEXT: Dashboard 3 -> Kafka Topics row for per-topic breakdown.",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "id": 8,
          "gridPos": {
            "x": 16,
            "y": 7,
            "w": 4,
            "h": 4
          }
        },
        {
          "title": "Request latency (mean ms): Produce / FetchConsumer",
          "type": "bargauge",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kafka_network_requestmetrics_mean{name=\"TotalTimeMs\", request=~\"Produce|FetchConsumer\"}",
              "refId": "A",
              "instant": true,
              "legendFormat": "{{request}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "min": 0
            },
            "overrides": []
          },
          "description": "WHAT: Mean end-to-end request time.\nWHY: Latency golden signal.\nNORMAL: Single-digit to low tens of ms on a lab cluster\nPROBLEM: Climbing sustained latency\nNEXT: 02 - Kafka Platform -> Broker Request Latency Breakdown row.",
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient"
          },
          "id": 9,
          "gridPos": {
            "x": 20,
            "y": 7,
            "w": 4,
            "h": 4
          }
        },
        {
          "collapsed": false,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 11
          },
          "id": 10,
          "panels": [],
          "title": "KRaft Controller",
          "type": "row"
        },
        {
          "title": "Current Leader (node id)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kafka_server_raft_metrics_current_leader{job=\"kraftcontroller\"}",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "WHAT: KRaft quorum leader's node id.\nWHY: Confirms which controller node is driving metadata.\nNORMAL: A stable single id\nPROBLEM: Frequent changes\nNEXT: 02 - Kafka Platform -> KRaft Controller row.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "id": 11,
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 4,
            "h": 4
          }
        },
        {
          "title": "Current Epoch",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kafka_server_raft_metrics_current_epoch{job=\"kraftcontroller\"}",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "WHAT: KRaft leader epoch.\nWHY: Increments on every leader election.\nNORMAL: Stable, rarely changing\nPROBLEM: Rapidly incrementing\nNEXT: Indicates repeated controller elections - check controller pod stability.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "id": 12,
          "gridPos": {
            "x": 4,
            "y": 12,
            "w": 4,
            "h": 4
          }
        },
        {
          "title": "Fenced Brokers",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kafka_controller_kafkacontroller_value{name=\"FencedBrokerCount\", job=\"kraftcontroller\"})",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "WHAT: Brokers the controller has fenced (lost contact with).\nWHY: A fenced broker can't lead partitions.\nNORMAL: 0\nPROBLEM: > 0\nNEXT: Check that broker's pod/network health in Dashboard 1.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "id": 13,
          "gridPos": {
            "x": 8,
            "y": 12,
            "w": 4,
            "h": 4
          }
        },
        {
          "title": "Raft append/fetch record rate",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kafka_server_raft_metrics_append_records_rate{job=\"kraftcontroller\"}",
              "refId": "A",
              "legendFormat": "append"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kafka_server_raft_metrics_fetch_records_rate{job=\"kraftcontroller\"}",
              "refId": "B",
              "legendFormat": "fetch"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {}
            },
            "overrides": []
          },
          "description": "WHAT: Metadata log append/fetch throughput.\nWHY: Confirms the metadata quorum is actively making progress.\nNORMAL: Non-zero, tracking cluster activity\nPROBLEM: Flatlines at zero\nNEXT: 02 - Kafka Platform -> KRaft Controller row.",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "id": 14,
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 4
          }
        },
        {
          "collapsed": false,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "id": 15,
          "panels": [],
          "title": "Kafka Connect",
          "type": "row"
        },
        {
          "title": "Workers Up",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(up{job=\"connect\"} == 1)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "WHAT: Connect worker pods currently scrapeable.\nWHY: Basic Connect cluster health.\nNORMAL: 1 (this deployment runs 1 worker)\nPROBLEM: 0\nNEXT: 08 - Connect Platform dashboard.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "id": 16,
          "gridPos": {
            "x": 0,
            "y": 17,
            "w": 4,
            "h": 4
          }
        },
        {
          "title": "Connectors Failed",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kafka_connect_connect_worker_metrics_connector_failed_task_count)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "WHAT: Tasks in FAILED state across all connectors.\nWHY: Direct data-pipeline breakage signal.\nNORMAL: 0\nPROBLEM: > 0\nNEXT: 08 - Connect Platform -> Task Errors metrics row, then Dashboard 3 -> Connect Business Workload.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "id": 17,
          "gridPos": {
            "x": 4,
            "y": 17,
            "w": 4,
            "h": 4
          }
        },
        {
          "title": "Tasks Running",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kafka_connect_connect_worker_metrics_connector_running_task_count)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "WHAT: Tasks currently RUNNING.\nWHY: Should match the configured connector/task count.\nNORMAL: Matches expected task count\nPROBLEM: Below expected\nNEXT: 08 - Connect Platform -> General row.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "id": 18,
          "gridPos": {
            "x": 8,
            "y": 17,
            "w": 4,
            "h": 4
          }
        },
        {
          "title": "Rebalancing",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kafka_connect_connect_worker_rebalance_metrics_rebalancing)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "WHAT: Whether the Connect group is currently rebalancing.\nWHY: Rebalances pause task processing.\nNORMAL: 0\nPROBLEM: 1 for an extended period\nNEXT: 08 - Connect Platform -> Coordinator & Rebalance row.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "id": 19,
          "gridPos": {
            "x": 12,
            "y": 17,
            "w": 4,
            "h": 4
          }
        },
        {
          "collapsed": false,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 21
          },
          "id": 20,
          "panels": [],
          "title": "Schema Registry",
          "type": "row"
        },
        {
          "title": "Instances Up",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(up{job=\"schemaregistry\"} == 1)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
