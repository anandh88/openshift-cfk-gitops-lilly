apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-dashboard-04-kafka-topics
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  04-kafka-topics.json: |
    {
      "uid": "kafka-topics",
      "title": "04 - Kafka Topics",
      "description": "Per-topic throughput. Cardinality note: one series per (topic x broker) for each metric - see docs/observability-cardinality.md.",
      "tags": [
        "kafka",
        "topics"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Topic Count (this broker)",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(count by (topic) (kafka_server_brokertopicmetrics_count{name=\"BytesInPerSec\", topic!=\"\"}))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "description": "",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "auto"
          }
        },
        {
          "id": 2,
          "title": "Bytes In by Topic",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 3,
            "w": 12,
            "h": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "topk(10, sum by (topic) (rate(kafka_server_brokertopicmetrics_count{name=\"BytesInPerSec\", topic!=\"\"}[5m])))",
              "refId": "A",
              "legendFormat": "{{topic}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            },
            "overrides": []
          },
          "description": "Top 10 topics by produce throughput"
        },
        {
          "id": 3,
          "title": "Bytes Out by Topic",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 3,
            "w": 12,
            "h": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "topk(10, sum by (topic) (rate(kafka_server_brokertopicmetrics_count{name=\"BytesOutPerSec\", topic!=\"\"}[5m])))",
              "refId": "A",
              "legendFormat": "{{topic}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            },
            "overrides": []
          },
          "description": "Top 10 topics by consume throughput"
        },
        {
          "id": 4,
          "title": "Messages In by Topic",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 24,
            "h": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "topk(10, sum by (topic) (kafka_server_brokertopicmetrics_count{name=\"MessagesInPerSec\", topic!=\"\"}))",
              "refId": "A",
              "legendFormat": "{{topic}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "description": ""
        }
      ]
    }
