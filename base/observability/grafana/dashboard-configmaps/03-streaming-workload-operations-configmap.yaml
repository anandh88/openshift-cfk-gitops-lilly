apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-dashboard-03-streaming-workload-operations
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  03-streaming-workload-operations.json: |
    {
      "uid": "streaming-workload-operations",
      "title": "03 - Streaming Workload Operations",
      "description": "Dashboard 3 of 3 (Platform -> Component -> Workload). Is business data actually flowing correctly through Kafka, Connect, and Flink? True per-consumer-group lag (a Burrow/kafka-lag-exporter style breakdown) is NOT available in this deployment - only client-reported lag and the broker's own aggregate lag-emitter percentiles are, and both are used here honestly rather than faking a per-group view (see docs/observability/METRIC-MAPPING.md).",
      "tags": [
        "platform",
        "workload",
        "dashboard-3"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "collapsed": false,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": [],
          "title": "Drill-down",
          "type": "row"
        },
        {
          "title": "Related dashboards",
          "type": "text",
          "options": {
            "mode": "markdown",
            "content": "[<- Dashboard 1: CFK Platform / Kubernetes Operations](/d/cfk-platform-operations)\n\n[<- Dashboard 2: Confluent Component Operations (Connect/Flink full detail is in its collapsed rows)](/d/platform-overview)"
          },
          "description": "Business-workload view: is data actually flowing correctly through Kafka, Connect, and Flink?",
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "id": 2,
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 24,
            "h": 5
          }
        },
        {
          "collapsed": false,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "id": 3,
          "panels": [],
          "title": "Kafka Topics",
          "type": "row"
        },
        {
          "title": "Bytes in/out by topic",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (topic) (rate(kafka_server_brokertopicmetrics_count{name=\"BytesInPerSec\", topic=~\"$topic\"}[5m]))",
              "refId": "A",
              "legendFormat": "{{topic}} in"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (topic) (rate(kafka_server_brokertopicmetrics_count{name=\"BytesOutPerSec\", topic=~\"$topic\"}[5m]))",
              "refId": "B",
              "legendFormat": "{{topic}} out"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {}
            },
            "overrides": []
          },
          "description": "WHAT: Per-topic produce/fetch byte rate.\nWHY: Identifies which topic is driving cluster throughput.\nNORMAL: Matches expected per-topic workload\nPROBLEM: One topic dominating unexpectedly\nNEXT: Kafka Connect / Flink rows below to find the producer/consumer.",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "id": 4,
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 12,
            "h": 8
          }
        },
        {
          "title": "Log size by topic (bytes, current)",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (topic) (kafka_log_log_value{job=\"kafka\", name=\"Size\", topic=~\"$topic\"})",
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "description": "WHAT: Current on-disk log size per topic, summed across partitions/brokers.\nWHY: Identifies the largest topics - the ones most likely to drive PVC exhaustion.\nNORMAL: Matches expected retention x throughput\nPROBLEM: Unexpectedly large/fast-growing topic\nNEXT: Dashboard 1 -> Persistent Storage row for the underlying PVC trend.",
          "transformations": [],
          "options": {
            "showHeader": true
          },
          "id": 5,
          "gridPos": {
            "x": 12,
            "y": 7,
            "w": 12,
            "h": 8
          }
        },
        {
          "collapsed": false,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 15
          },
          "id": 6,
          "panels": [],
          "title": "Consumer / Client Lag (corrected: native lag-emitter now used as primary source)",
          "type": "row"
        },
        {
          "id": 20,
          "title": "Top 15 consumer groups/partitions by lag (native Confluent lag emitter)",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 24,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "topk(15, kafka_server_tenant_metrics_consumer_lag_offsets{job=\"kafka\", consumer_group=~\"$consumer_group\", topic=~\"$topic\"})",
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "description": "WHAT: real per-consumer-group/topic/partition/member lag in offsets, from Kafka's own broker-side consumer-lag-emitter (kafka.server:type=tenant-metrics,attribute=consumer-lag-offsets) - active on this broker with no extra config needed (confirmed live). CORRECTION: an earlier pass in this dashboard's history said true per-consumer-group lag was unavailable and would need a separate Burrow/kafka-lag-exporter deployment - that was wrong; this broker-native metric provides exactly that breakdown. WHY: this is the single most-asked 'is my consumer keeping up' question, now answerable per group/topic/partition/member instead of only in aggregate. NORMAL: near 0, or draining. PROBLEM: large/growing values on a specific group+partition - correlate with that consumer's poll/commit rate and the source system's write rate. NEXT: identify which member/client-id is lagging, then check that specific consumer's health.",
          "options": {
            "showHeader": true
          }
        },
        {
          "id": 21,
          "title": "Lag trend, by consumer group / topic / partition",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 25,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kafka_server_tenant_metrics_consumer_lag_offsets{job=\"kafka\", consumer_group=~\"$consumer_group\", topic=~\"$topic\"}",
              "refId": "A",
              "legendFormat": "{{consumer_group}} / {{topic}}-{{partition}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "description": "WHAT: the same native lag-emitter metric as a trend over time, to see whether lag is growing, flat, or draining, not just its current value.",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "title": "Client-reported lag (max), by client/topic/partition",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kafka_consumer_consumer_fetch_manager_metrics_records_lag_max{topic=~\"$topic\"}",
              "refId": "A",
              "legendFormat": "{{client_id}} / {{topic}}-{{partition}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {}
            },
            "overrides": []
          },
          "description": "WHAT: Max records-lag as reported by each JMX-instrumented Kafka consumer client running inside a broker/Connect/Flink JVM (this includes the brokers' own internal consumers, e.g. the license consumer on `_confluent-command`, not only application consumer groups).\nWHY: This is the real per-client lag signal exposed on this cluster.\nNORMAL: Near 0\nPROBLEM: Growing without bound\nNEXT: Check that client's producer/consumer rate below, or its pod health in Dashboard 1.",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "id": 7,
          "gridPos": {
            "x": 0,
            "y": 33,
            "w": 12,
            "h": 8
          }
        },
        {
          "title": "Broker-side consumer-lag percentiles (group coordinator)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kafka_coordinator_group_consumer_lag_emitter_99thpercentile{name=\"ClassicMemberSize\"}",
              "refId": "A",
              "legendFormat": "p99 - classic members"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kafka_coordinator_group_consumer_lag_emitter_95thpercentile{name=\"ClassicMemberSize\"}",
              "refId": "B",
              "legendFormat": "p95 - classic members"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {}
            },
            "overrides": []
          },
          "description": "WHAT: Confluent's own group-coordinator lag-emitter telemetry (cluster-wide percentile, not broken out per consumer group - no per-group Burrow-style lag exporter is deployed in this lab, see docs/observability/METRIC-MAPPING.md).\nWHY: The closest cluster-wide lag signal available without adding a dedicated lag exporter.\nNORMAL: Low and flat\nPROBLEM: Climbing\nNEXT: Add a Burrow/kafka-lag-exporter deployment for true per-consumer-group breakdown - documented as a follow-up, not faked here.",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "id": 8,
          "gridPos": {
            "x": 12,
            "y": 33,
            "w": 12,
            "h": 8
          }
        },
        {
          "collapsed": false,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 41
          },
          "id": 9,
          "panels": [],
          "title": "Kafka Connect: Business Workload (source/sink task detail)",
          "type": "row"
        },
        {
          "title": "Source record poll/write rate, by connector",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (connector) (kafka_connect_source_task_metrics_source_record_poll_rate{connector=~\"$connector\"})",
              "refId": "A",
              "legendFormat": "{{connector}} poll"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (connector) (kafka_connect_source_task_metrics_source_record_write_rate{connector=~\"$connector\"})",
              "refId": "B",
              "legendFormat": "{{connector}} write"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {}
            },
            "overrides": []
          },
          "description": "WHAT: Records/sec the source connector polls from its source system vs. writes to Kafka.\nWHY: poll >> write sustained means Kafka-side backpressure; write >> poll is impossible (would mean data invented).\nNORMAL: poll ~= write\nPROBLEM: poll and write both near zero (source system slow) vs. poll healthy but write lagging (Kafka-side slow)\nNEXT: poll_batch time panel below to tell source-system-slow from Connect-processing-slow.",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "id": 10,
          "gridPos": {
            "x": 0,
            "y": 42,
            "w": 12,
            "h": 8
          }
        },
        {
          "title": "Poll batch time (avg/max, ms), by connector",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kafka_connect_source_task_metrics_poll_batch_avg_time_ms{connector=~\"$connector\"}",
              "refId": "A",
              "legendFormat": "{{connector}} avg"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kafka_connect_source_task_metrics_poll_batch_max_time_ms{connector=~\"$connector\"}",
              "refId": "B",
              "legendFormat": "{{connector}} max"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {}
            },
            "overrides": []
          },
          "description": "WHAT: Time spent per poll batch against the source system (e.g. the SQL Server JDBC source).\nWHY: High poll-batch time points at the source system, not Kafka or Connect itself.\nNORMAL: Low, stable\nPROBLEM: Climbing\nNEXT: Check the source system's own health (e.g. SQL Server/AD tunnel health for the Kerberos JDBC connector).",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "id": 11,
          "gridPos": {
            "x": 12,
            "y": 42,
            "w": 12,
            "h": 8
          }
        },
        {
          "title": "Errors/retries/skipped per sec, by connector",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (connector) (rate(kafka_connect_task_error_metrics_total_record_errors{connector=~\"$connector\"}[$__rate_interval]))",
              "refId": "A",
              "legendFormat": "{{connector}} errors/sec"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (connector) (rate(kafka_connect_task_error_metrics_total_retries{connector=~\"$connector\"}[$__rate_interval]))",
              "refId": "B",
              "legendFormat": "{{connector}} retries/sec"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (connector) (rate(kafka_connect_task_error_metrics_total_records_skipped{connector=~\"$connector\"}[$__rate_interval]))",
              "refId": "C",
              "legendFormat": "{{connector}} skipped/sec"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {}
            },
            "overrides": []
          },
          "description": "WHAT: per-second error/retry/skip rate, by connector - corrected from graphing the raw cumulative counters directly (which only ever goes up and hides whether the problem is active right now or happened once months ago). WHY: rate is what tells you if errors are actively occurring. NORMAL: 0. PROBLEM: any sustained nonzero rate. NEXT: 08's Task Errors row (folded into Dashboard 2's Connect section) for DLQ detail, or the source-system/Kafka split above.",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "id": 12,
          "gridPos": {
            "x": 0,
            "y": 50,
            "w": 24,
            "h": 8
          }
        },
        {
          "collapsed": false,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 58
          },
          "id": 13,
          "panels": [],
          "title": "Apache Flink: Business Workload",
          "type": "row"
        },
        {
          "title": "Records in/out per sec, by operator",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (task_name) (flink_taskmanager_job_task_numRecordsInPerSecond)",
              "refId": "A",
              "legendFormat": "{{task_name}} in"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (task_name) (flink_taskmanager_job_task_numRecordsOutPerSecond)",
              "refId": "B",
              "legendFormat": "{{task_name}} out"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {}
            },
            "overrides": []
          },
          "description": "WHAT: Per-operator record throughput for the running Flink job (statefarm-claims-processor).\nWHY: Where in the pipeline a slowdown originates - compare consecutive operators.\nNORMAL: Downstream operator's 'in' ~= upstream operator's 'out'\nPROBLEM: A gap opening up between them\nNEXT: 24 - Flink -> Backpressure & Task Time Breakdown row to find the exact bottleneck operator/subtask.",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "id": 14,
          "gridPos": {
            "x": 0,
            "y": 59,
            "w": 12,
            "h": 8
          }
        },
        {
          "title": "Busy / backpressured time (ms/sec), by task",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "flink_taskmanager_job_task_busyTimeMsPerSecond",
              "refId": "A",
              "legendFormat": "{{task_name}} busy"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "flink_taskmanager_job_task_backPressuredTimeMsPerSecond",
              "refId": "B",
              "legendFormat": "{{task_name}} backpressured"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {}
            },
            "overrides": []
          },
          "description": "WHAT: How much of each second a task spent busy vs. backpressured by a downstream operator.\nWHY: The standard Flink signal for 'which operator is the bottleneck'.\nNORMAL: Backpressured time near 0\nPROBLEM: Backpressured time approaching 1000ms/sec (fully blocked)\nNEXT: 24 - Flink -> Flink Skew Detection (subtask-level) to find which specific subtask.",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "id": 15,
          "gridPos": {
            "x": 12,
            "y": 59,
            "w": 12,
            "h": 8
          }
        },
        {
          "title": "Checkpoints: completed",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(flink_jobmanager_job_numberOfCompletedCheckpoints[$__range]))",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "WHAT: successful checkpoints within the CURRENTLY SELECTED time range (not lifetime) - corrected from a flat lifetime sum, which can't distinguish '3 failures 5 minutes ago' from '3 failures 3 months ago'. Change the dashboard time range to look further back or narrower.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "id": 16,
          "gridPos": {
            "x": 0,
            "y": 67,
            "w": 4,
            "h": 4
          }
        },
        {
          "title": "Checkpoints: failed",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(flink_jobmanager_job_numberOfFailedCheckpoints[$__range]))",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "WHAT: failed checkpoints within the currently selected time range (not lifetime) - same correction as Checkpoints: completed. NORMAL: 0. PROBLEM: > 0 in a recent/narrow window means an active problem, not old history.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "id": 17,
          "gridPos": {
            "x": 4,
            "y": 67,
            "w": 4,
            "h": 4
          }
        },
        {
          "title": "Last checkpoint size (bytes)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "flink_jobmanager_job_lastCheckpointSize",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
