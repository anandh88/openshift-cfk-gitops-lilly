    {
      "uid": "kafka-platform",
      "title": "02 - Kafka Platform (KRaft + Brokers + Topics)",
      "description": "Consolidates the former 02/03/04/07/10 dashboards into one, per request - KRaft controller, broker cluster, and topics in a single view, with pie charts and gauges for at-a-glance health. Adapted from Confluent's own confluentinc/jmx-monitoring-stacks reference (kafka-cluster-kraft.json, kraft.json, kafka-topics-kraft.json). Every panel verified live against this cluster's Prometheus. Gaps filled on this pass: per-topic log-size/partition-count pies, Transaction Coordinator metrics (real, currently idle - no EOS producer in use), broker quota ceilings (real, currently unlimited). Still dropped (confirmed not present, not faked): tiered storage, Linux disk read/write bytes MBean, client-version tracking, acceptor blocked percent. Gap pass against a user-provided reference dashboard: added Preferred Replica Imbalance, Under Min ISR Partitions, Online Partitions (derived), per-topic/per-broker message and request-rate breakdowns, Response Queue Size, and per-broker connection metrics - every existing panel kept unchanged. Confirmed still not applicable: ZooKeeper (KRaft-only cluster), Acceptor Blocked Percentage, client-version tracking (attributes don't exist on this exporter).",
      "tags": [
        "kafka",
        "kraft"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
