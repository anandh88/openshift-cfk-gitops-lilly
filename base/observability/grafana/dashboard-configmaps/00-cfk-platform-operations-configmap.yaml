                  {
                    "color": "yellow",
                    "value": 14
                  },
                  {
                    "color": "green",
                    "value": 30
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "WHAT: days until each cert-manager-issued certificate expires (platform-ca-issuer chain, plus every operator's self-signed serving cert - Flink operator, CMF, etc.). WHY: an expired cert silently breaks TLS-dependent internal traffic (Kafka listeners, Argo CD, webhooks) with no other obvious symptom. NORMAL: > 30 days remaining, decreasing linearly then jumping back up on cert-manager's automatic renewal. PROBLEM: < 14 days remaining and NOT renewing (a flat/non-renewing line close to 0). NEXT: oc describe certificate -A for the specific cert; check cert-manager pod logs for renewal failures.",
