apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-dashboard-00-cfk-platform-operations
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  00-cfk-platform-operations.json: |
    {
      "uid": "cfk-platform-operations",
      "title": "00 - CFK Platform / Kubernetes Operations",
      "description": "Dashboard 1 of 3 (Platform -> Component -> Workload). Is Kubernetes/OpenShift infrastructure, scheduling, storage, networking, or an operator causing the problem? All panels use kube-state-metrics, kubelet/cAdvisor, and Prometheus self-metrics only for Layer 1A - no node-exporter is deployed in this single-node CRC lab (deliberately trimmed, see apps/observability-app.yaml), so node-level disk IOPS/latency are not available and are not faked here (federating an OpenShift-platform node-exporter was evaluated and documented as a P1 item in docs/observability/GAP-ANALYSIS.md, not silently dropped). Only the first three rows are expanded by default (golden signals, node health, pod table) - every other row is collapsed to keep the first viewport operational rather than a long scroll.",
      "tags": [
        "platform",
        "kubernetes",
        "dashboard-1"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "collapsed": false,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": [],
          "title": "Platform Golden Signals",
          "type": "row"
        },
        {
          "title": "Pods Running",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kube_pod_status_phase{namespace=~\"$namespace\", phase=\"Running\"})",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "WHAT: Count of platform pods in Running phase.\nWHY: The baseline healthy-pod count for this stack.\nNORMAL: One entry per expected replica (kafka x3, connect x1, schemaregistry x1, controlcenter x1, kafkarestproxy x1, kraftcontroller x1, flink JM+TM, operators).\nPROBLEM: A drop from the expected count.\nNEXT: Pod Operational Table below to see which pod left Running.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "id": 2,
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          }
        },
        {
          "title": "Pods Pending",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kube_pod_status_phase{namespace=~\"$namespace\", phase=\"Pending\"} or vector(0))",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "WHAT: Pods stuck in Pending.\nWHY: Usually scheduling or PVC-binding failures.\nNORMAL: 0\nPROBLEM: Sustained > 0\nNEXT: Kubernetes Scheduling/Failures row - check PVC binding and node capacity.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "id": 3,
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 4
          }
        },
        {
          "title": "Pods Failed",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kube_pod_status_phase{namespace=~\"$namespace\", phase=\"Failed\"} or vector(0))",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "WHAT: Pods in Failed phase.\nWHY: Container exited non-zero and was not restarted.\nNORMAL: 0\nPROBLEM: > 0\nNEXT: oc describe pod / oc logs on the failed pod.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "id": 4,
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 4
          }
        },
        {
          "title": "Container Restarts (1h)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[1h]) or vector(0))",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "WHAT: Container restarts in the last hour, platform-wide.\nWHY: Restarts hide instability that 'pod is Running' alone won't show.\nNORMAL: 0\nPROBLEM: Any sustained increase\nNEXT: Pod Operational Table -> Scheduling/Failures row for CrashLoopBackOff/OOMKilled reasons.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "id": 5,
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 4
          }
        },
        {
          "title": "Prometheus Targets Down",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(up{namespace=~\"$namespace\"} == 0) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "WHAT: Targets Prometheus could not scrape at all.\nWHY: Distinguishes 'metric is really zero' from 'we have no data'.\nNORMAL: 0\nPROBLEM: > 0 - a component's /metrics endpoint is unreachable (NetworkPolicy, pod down, port change).\nNEXT: Prometheus Self-Monitoring row: check `up{job=...}` for the specific job, then NetworkPolicy/pod status.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "id": 6,
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 4
          }
        },
        {
          "title": "Cluster CPU request allocation %",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kube_pod_container_resource_requests{resource=\"cpu\", namespace=~\"$namespace\"}) / sum(kube_node_status_allocatable{resource=\"cpu\"}) * 100",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "WHAT: Sum of CPU *requests* for this stack as a % of total cluster-wide allocatable CPU (this is a single-node CRC lab, so cluster == node here; see the per-node table in Node Health for the multi-node-portable version).\nWHY: This CRC node has repeatedly hit >90% requested, causing liveness-probe timeouts across every pod (Grafana, Prometheus, Connect, Control Center all observed flapping under this condition).\nNORMAL: < 70%\nPROBLEM: > 90% sustained -> scheduler starves even trivial health-check handlers.\nNEXT: Reduce component resource requests, or raise CRC's `crc config set cpus/memory` allocation and restart CRC.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "id": 7,
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 4
          }
        },
        {
          "title": "Cluster memory request allocation %",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kube_pod_container_resource_requests{resource=\"memory\", namespace=~\"$namespace\"}) / sum(kube_node_status_allocatable{resource=\"memory\"}) * 100",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 75
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "WHAT: Sum of memory *requests* for this stack as a % of total cluster-wide allocatable memory.\nWHY: Same overcommit risk as CPU - this node has been observed at 99-100% memory requests.\nNORMAL: < 75%\nPROBLEM: > 90%\nNEXT: Same remediation as Cluster CPU request allocation %.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "id": 8,
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 4,
            "h": 4
          }
        },
        {
          "collapsed": false,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 9
          },
          "id": 9,
          "panels": [],
          "title": "Node Health",
          "type": "row"
        },
        {
          "title": "Platform CPU usage vs allocatable",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", container!=\"\"}[5m]))",
              "refId": "A",
              "legendFormat": "actual usage"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kube_pod_container_resource_requests{resource=\"cpu\", namespace=~\"$namespace\"})",
              "refId": "B",
              "legendFormat": "requested"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kube_node_status_allocatable{resource=\"cpu\"})",
              "refId": "C",
              "legendFormat": "cluster allocatable"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {}
            },
            "overrides": []
          },
          "description": "WHAT: Actual CPU usage vs requested vs the cluster's total allocatable CPU (cores).\nWHY: No node-exporter is deployed here (single-node CRC lab, deliberately trimmed) so this is derived from kube-state-metrics + kubelet/cAdvisor, not node_cpu_seconds_total. See docs/observability/GAP-ANALYSIS.md for the node-exporter federation option evaluated for production.\nNORMAL: usage line well under the allocatable line\nPROBLEM: usage or requested approaching allocatable\nNEXT: Namespace Capacity row to find which namespace is driving it.",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "id": 10,
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 12,
            "h": 8
          }
        },
        {
          "title": "Per-node CPU/memory: used, requested, allocatable",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (node) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", container!=\"\"}[5m]))",
              "refId": "A",
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (node) (kube_pod_container_resource_requests{resource=\"cpu\", namespace=~\"$namespace\"})",
              "refId": "B",
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (node) (kube_node_status_allocatable{resource=\"cpu\"})",
              "refId": "C",
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (node) (container_memory_working_set_bytes{namespace=~\"$namespace\", container!=\"\"})",
              "refId": "D",
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (node) (kube_pod_container_resource_requests{resource=\"memory\", namespace=~\"$namespace\"})",
              "refId": "E",
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (node) (kube_node_status_allocatable{resource=\"memory\"})",
              "refId": "F",
              "instant": true,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "description": "WHAT: Per-node breakdown of CPU/memory used vs requested vs allocatable - written to generalize cleanly to a real multi-node cluster (this CRC lab only has one node, 'crc', so it's a table with one row today).\nWHY: The multi-node-portable version of the cluster-wide allocation % stat panels above - on a real cluster this is where you'd spot one specific overloaded worker.\nNORMAL: request sums well under each node's allocatable column\nPROBLEM: a specific node's request/allocatable ratio much higher than its peers\nNEXT: Reschedule/rebalance workloads off that node, or add capacity.",
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "node",
                "mode": "outer"
              }
            }
          ],
          "options": {
            "showHeader": true
          },
          "id": 11,
          "gridPos": {
            "x": 12,
            "y": 10,
            "w": 12,
            "h": 8
          }
        },
        {
          "title": "Node Conditions",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kube_node_status_condition{status=\"true\"}",
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "description": "WHAT: Current Kubernetes node conditions (Ready/MemoryPressure/DiskPressure/PIDPressure/NetworkUnavailable) with status=true.\nWHY: A true MemoryPressure/DiskPressure condition means the kubelet itself is evicting pods, a step worse than plain overcommit.\nNORMAL: Only condition=Ready\nPROBLEM: Any of MemoryPressure/DiskPressure/PIDPressure/NetworkUnavailable present\nNEXT: oc describe node crc",
          "transformations": [],
          "options": {
            "showHeader": true
          },
          "id": 12,
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 24,
            "h": 6
          }
        },
        {
          "collapsed": false,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 24
          },
          "id": 13,
          "panels": [],
          "title": "Pod Operational Table",
          "type": "row"
        },
        {
          "title": "Pod status / restarts / resource usage",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kube_pod_status_phase{namespace=~\"$namespace\", pod=~\"$pod\"} == 1",
              "refId": "A",
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod, namespace) (kube_pod_container_status_restarts_total{namespace=~\"$namespace\", pod=~\"$pod\"})",
              "refId": "B",
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod, namespace) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", pod=~\"$pod\", container!=\"\"}[5m]))",
              "refId": "C",
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod, namespace) (container_memory_working_set_bytes{namespace=~\"$namespace\", pod=~\"$pod\", container!=\"\"})",
              "refId": "D",
              "instant": true,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "description": "WHAT: One row per pod: actual status (Running/Pending/Failed/Unknown - the phase label is now preserved, not dropped by an aggregation), restart count, CPU cores, memory bytes.\nWHY: The single table an operator scans first when told 'something in the platform is unhealthy'.\nNORMAL: phase=Running, restarts flat, cpu/mem well under limits (see Pod CPU/Pod Memory rows for the % view)\nPROBLEM: phase != Running, or restarts climbing\nNEXT: Open the pod's logs/events (oc logs / oc describe pod), or drill into the Pod CPU/Pod Memory rows for that pod's trend.",
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "pod",
                "mode": "outer"
              }
            }
          ],
          "options": {
            "showHeader": true
          },
          "id": 14,
          "gridPos": {
            "x": 0,
            "y": 25,
            "w": 24,
            "h": 9
          }
        },
        {
          "collapsed": true,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 35
          },
          "id": 17,
          "title": "Namespace Capacity",
          "description": "CPU/memory usage vs requests vs limits, broken out per namespace.",
          "type": "row",
          "panels": [
            {
              "title": "CPU: usage vs requests vs limits, by namespace",
              "type": "timeseries",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", container!=\"\"}[5m]))",
                  "refId": "A",
                  "legendFormat": "{{namespace}} usage"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum by (namespace) (kube_pod_container_resource_requests{resource=\"cpu\", namespace=~\"$namespace\"})",
                  "refId": "B",
                  "legendFormat": "{{namespace}} request"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum by (namespace) (kube_pod_container_resource_limits{resource=\"cpu\", namespace=~\"$namespace\"})",
                  "refId": "C",
                  "legendFormat": "{{namespace}} limit"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "custom": {}
                },
                "overrides": []
              },
              "description": "WHAT: Per-namespace CPU usage against what it asked for (requests) and its ceiling (limits).\nWHY: A namespace whose usage tracks its limit line is the one starving everyone else.\nNORMAL: usage < requests\nPROBLEM: usage approaching or exceeding limits\nNEXT: Pod Operational Table filtered to that namespace.",
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom"
                },
                "tooltip": {
                  "mode": "multi"
                }
              },
              "id": 15,
