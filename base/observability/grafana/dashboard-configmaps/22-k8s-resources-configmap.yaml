apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-dashboard-22-k8s-resources
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  22-k8s-resources.json: |
    {
      "uid": "k8s-resources",
      "title": "22 - Kubernetes/OpenShift Resources",
      "description": "cAdvisor/kubelet + kube-state-metrics based pod/container/PVC/network visibility across the platform's namespaces.",
      "tags": [
        "infra",
        "kubernetes"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "CPU Usage by Pod",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=~\"confluent|monitoring|flink-.*|cmf-operator\", container!=\"\"}[5m]))",
              "refId": "A",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "description": ""
        },
        {
          "id": 2,
          "title": "Memory Working Set by Pod",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=~\"confluent|monitoring|flink-.*|cmf-operator\", container!=\"\"})",
              "refId": "A",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "description": ""
        },
        {
          "id": 3,
          "title": "Container Restarts",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "increase(kube_pod_container_status_restarts_total{namespace=~\"confluent|monitoring|flink-.*|cmf-operator\"}[1h])",
              "refId": "A",
              "legendFormat": "{{namespace}}/{{pod}}/{{container}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "description": ""
        },
        {
          "id": 4,
          "title": "Pods Pending",
          "type": "stat",
          "gridPos": {
            "x": 12,
            "y": 9,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kube_pod_status_phase{namespace=~\"confluent|monitoring|flink-.*|cmf-operator\", phase=\"Pending\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "green",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "auto"
          }
        },
        {
          "id": 5,
          "title": "Pods Failed",
          "type": "stat",
          "gridPos": {
            "x": 16,
            "y": 9,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kube_pod_status_phase{namespace=~\"confluent|monitoring|flink-.*|cmf-operator\", phase=\"Failed\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "green",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "auto"
          }
        },
        {
          "id": 6,
          "title": "Pods Running",
          "type": "stat",
          "gridPos": {
            "x": 20,
            "y": 9,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kube_pod_status_phase{namespace=~\"confluent|monitoring|flink-.*|cmf-operator\", phase=\"Running\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "description": "",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "auto"
          }
        },
        {
          "id": 7,
          "title": "PVC Usage %",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 17,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kubelet_volume_stats_used_bytes{namespace=~\"confluent|monitoring\"} / kubelet_volume_stats_capacity_bytes{namespace=~\"confluent|monitoring\"}",
              "refId": "A",
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "description": ""
        },
        {
          "id": 8,
          "title": "Network Receive/Transmit bytes/sec",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 17,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (rate(container_network_receive_bytes_total{namespace=~\"confluent|monitoring\"}[5m]))",
              "refId": "A",
              "legendFormat": "{{pod}} rx"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (rate(container_network_transmit_bytes_total{namespace=~\"confluent|monitoring\"}[5m]))",
              "refId": "A",
              "legendFormat": "{{pod}} tx"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            },
            "overrides": []
          },
          "description": ""
        }
      ]
    }
