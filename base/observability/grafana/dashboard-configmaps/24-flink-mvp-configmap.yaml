    {
      "uid": "flink-mvp",
      "title": "24 - Flink (MVP, awaiting first job run)",
      "description": "Synthesized from the standard Flink PrometheusReporter metric names documented by the community Grafana dashboard 11049, Ververica's 'Metrics for Troubleshooting' guide, IBM's Flink-monitoring tutorial, and Flink's own 'new Prometheus connector' announcement - NOT verified against this cluster's live Prometheus, because there is nothing to verify: zero flink_* metrics exist here (confirmed live) since statefarm-claims-processor has never reconciled into a running job (image still a TODO per flink-application.yaml's own header comment; CMF operator numSynced:0; no jobmanager/taskmanager pod has ever existed). metrics.reporter.prom was added to flink-application.yaml so this dashboard works with zero further changes the moment a real job runs. Every panel will show No Data until then - that's expected, not broken.",
      "tags": [
        "flink"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "gridPos": {
            "h": 4,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "code": {
              "language": "plaintext",
              "showLineNumbers": false,
              "showMiniMap": false
            },
            "content": "### This dashboard shows **No Data** right now - by design, not a bug.\n\nNo Flink job has ever run in this cluster. `flink-jobs/statefarm-claims-processor`\nhas never reconciled (0 synced by the CMF operator, empty `.status`, no\njobmanager/taskmanager pod has ever existed) - its own manifest says the\ncontainer image is still a `TODO` pending a real build/publish.\n\nEvery panel below uses Flink's **official, standard PrometheusReporter\nmetric names** (same ones used by the community dashboard\n[11049](https://grafana.com/grafana/dashboards/11049-flink-dashboard/) and\nVerverica's own troubleshooting guide) - not a guess. `metrics.reporter.prom`\nwas added to `flink-application.yaml` alongside this dashboard. The moment a\nreal job runs with that config, this dashboard starts working with **zero\nfurther changes** - that's the whole point of building it as a scaffold now\ninstead of waiting.",
            "mode": "markdown"
          },
          "title": "",
          "type": "text"
        },
        {
          "collapsed": false,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
