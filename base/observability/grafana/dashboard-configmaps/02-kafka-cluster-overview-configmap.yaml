apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-dashboard-02-kafka-cluster-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  02-kafka-cluster-overview.json: |
    {
      "uid": "kafka-cluster-overview",
      "title": "02 - Kafka Cluster Overview",
      "description": "Cluster-wide health, throughput, and replication signals.",
      "tags": [
        "kafka"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Cluster ID",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(up{job=\"kafka\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "description": "broker count as a stand-in stat; see Broker Deep Dive for per-broker detail",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "auto"
          }
        },
        {
          "id": 2,
          "title": "Total Partitions (this broker's view)",
          "type": "stat",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kafka_server_replicamanager_value{name=\"PartitionCount\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "description": "",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "auto"
          }
        },
        {
          "id": 3,
          "title": "Global Topic Count",
          "type": "stat",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kafka_controller_kafkacontroller_value{name=\"GlobalTopicCount\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "description": "",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "auto"
          }
        },
        {
          "id": 4,
          "title": "Preferred Replica Imbalance",
          "type": "stat",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kafka_controller_kafkacontroller_value{name=\"PreferredReplicaImbalanceCount\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "description": "",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "auto"
          }
        },
        {
          "id": 5,
          "title": "Bytes In/Out per broker",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 3,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "rate(kafka_server_brokertopicmetrics_count{name=\"BytesInPerSec\"}[5m])",
              "refId": "A",
              "legendFormat": "{{pod}} in"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "rate(kafka_server_brokertopicmetrics_count{name=\"BytesOutPerSec\"}[5m])",
              "refId": "A",
              "legendFormat": "{{pod}} out"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            },
            "overrides": []
          },
          "description": ""
        },
        {
          "id": 6,
          "title": "Produce/Fetch Requests per sec",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 3,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kafka_server_brokertopicmetrics_count{name=\"TotalProduceRequestsPerSec\"}",
              "refId": "A",
              "legendFormat": "{{pod}} produce"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kafka_server_brokertopicmetrics_count{name=\"TotalFetchRequestsPerSec\"}",
              "refId": "A",
              "legendFormat": "{{pod}} fetch"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "description": ""
        },
        {
          "id": 7,
          "title": "Under-Replicated / Under-Min-ISR Partitions",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 11,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kafka_server_replicamanager_value{name=\"UnderReplicatedPartitions\"}",
              "refId": "A",
              "legendFormat": "{{pod}} URP"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kafka_server_replicamanager_value{name=\"UnderMinIsrPartitionCount\"}",
              "refId": "A",
              "legendFormat": "{{pod}} under-min-ISR"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "description": ""
        },
        {
          "id": 8,
          "title": "Failed Produce/Fetch Requests per sec",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 11,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kafka_server_brokertopicmetrics_count{name=\"FailedProduceRequestsPerSec\"}",
              "refId": "A",
              "legendFormat": "{{pod}} produce fail"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kafka_server_brokertopicmetrics_count{name=\"FailedFetchRequestsPerSec\"}",
              "refId": "A",
              "legendFormat": "{{pod}} fetch fail"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "description": ""
        }
      ]
    }
