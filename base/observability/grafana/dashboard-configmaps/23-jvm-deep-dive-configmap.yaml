apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-dashboard-23-jvm-deep-dive
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  23-jvm-deep-dive.json: |
    {
      "uid": "jvm-deep-dive",
      "title": "23 - JVM Deep Dive",
      "description": "Generic JVM dashboard covering every JMX-Prometheus-exporter-scraped component (Kafka, KRaft, Connect, Schema Registry, REST Proxy, Control Center) via the $pod variable.",
      "tags": [
        "jvm"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Heap Used vs Max",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "java_lang_memory_heapmemoryusage_used{namespace=\"confluent\"}",
              "refId": "A",
              "legendFormat": "{{pod}} used"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "java_lang_memory_heapmemoryusage_max{namespace=\"confluent\"}",
              "refId": "A",
              "legendFormat": "{{pod}} max"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "description": ""
        },
        {
          "id": 2,
          "title": "Non-Heap Used",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "java_lang_memory_nonheapmemoryusage_used{namespace=\"confluent\"}",
              "refId": "A",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "description": ""
        },
        {
          "id": 3,
          "title": "Thread Count",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "java_lang_threading_threadcount{namespace=\"confluent\"}",
              "refId": "A",
              "legendFormat": "{{pod}}"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "java_lang_threading_daemonthreadcount{namespace=\"confluent\"}",
              "refId": "A",
              "legendFormat": "{{pod}} daemon"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "description": ""
        },
        {
          "id": 4,
          "title": "Process CPU Load",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "java_lang_operatingsystem_processcpuload{namespace=\"confluent\"}",
              "refId": "A",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "description": ""
        },
        {
          "id": 5,
          "title": "Open File Descriptors",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "java_lang_operatingsystem_openfiledescriptorcount{namespace=\"confluent\"}",
              "refId": "A",
              "legendFormat": "{{pod}} open"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "java_lang_operatingsystem_maxfiledescriptorcount{namespace=\"confluent\"}",
              "refId": "A",
              "legendFormat": "{{pod}} max"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "description": ""
        }
      ]
    }
