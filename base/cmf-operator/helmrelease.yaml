# Flux HelmRelease for Confluent Manager for Apache Flink. Applied via
# Argo CD (which reconciles the HelmRelease CR); the Flux source-controller
# and helm-controller must already be installed on the cluster.
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: cmf-operator
  namespace: cmf-operator
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  interval: 5m
  chart:
    spec:
      chart: confluent-manager-for-apache-flink
      version: 1.2.0
      sourceRef:
        kind: HelmRepository
        name: confluentinc
        namespace: cmf-operator
      interval: 5m
  releaseName: cmf-operator
  targetNamespace: cmf-operator
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1
        memory: 2Gi
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: confluentinc
  namespace: cmf-operator
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  interval: 1h
  url: https://packages.confluent.io/helm
