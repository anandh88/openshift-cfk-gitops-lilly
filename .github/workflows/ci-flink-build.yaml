# TODO: replace with your GitHub username in the ghcr.io image name below
name: ci-flink-build

on:
  push:
    branches:
      - main
    paths:
      - "flink-jobs/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Build claims-processor jar
        working-directory: flink-jobs/claims-processor
        run: mvn package -DskipTests

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mkurre/flink-jobs/claims-processor
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: flink-jobs/claims-processor
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update FlinkApplication image tag
        if: github.event_name != 'pull_request'
        run: |
          curl -sL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          short_sha=$(git rev-parse --short HEAD)
          yq -i ".spec.image = \"ghcr.io/mkurre/flink-jobs/claims-processor:sha-${short_sha}\"" \
            base/flink-jobs/flink-application.yaml

      - name: Commit and push updated manifest
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add base/flink-jobs/flink-application.yaml
          git diff --cached --quiet || git commit -m "chore: update flink image [skip ci]"
          git push
