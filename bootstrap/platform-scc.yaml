# Restricted-style SCC granted to the platform's service accounts.
# Runs as non-root within the 1000-65534 UID/GID range, drops all
# capabilities except NET_BIND_SERVICE (needed for privileged listener ports).
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: confluent-platform-scc
allowPrivilegedContainer: false
allowPrivilegeEscalation: false
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
readOnlyRootFilesystem: false
runAsUser:
  type: MustRunAsRange
  uidRangeMin: 1000
  uidRangeMax: 65534
fsGroup:
  type: MustRunAs
  ranges:
    - min: 1000
      max: 65534
supplementalGroups:
  type: MustRunAs
  ranges:
    - min: 1000
      max: 65534
seLinuxContext:
  type: MustRunAs
seccompProfiles:
  - runtime/default
requiredDropCapabilities:
  - ALL
allowedCapabilities:
  - NET_BIND_SERVICE
volumes:
  - configMap
  - secret
  - persistentVolumeClaim
  - emptyDir
  - projected
  - downwardAPI
users:
  - system:serviceaccount:confluent-operator:confluent-for-kubernetes
  - system:serviceaccount:confluent:default
  - system:serviceaccount:confluent:kafka-sa
  - system:serviceaccount:flink-jobs:flink-service-account
  - system:serviceaccount:argocd:argocd-application-controller
  - system:serviceaccount:argocd:argocd-server
