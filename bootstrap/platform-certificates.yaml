# Leaf certificates for every platform component, issued by platform-ca-issuer
# (see cert-manager-issuers.yaml). All use RSA 2048 PKCS8, 1y validity.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kafka-tls
  namespace: confluent
spec:
  secretName: kafka-tls-secret
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
    encoding: PKCS8
  issuerRef:
    name: platform-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - kafka
    - kafka.confluent.svc.cluster.local
    - "*.kafka.confluent.svc.cluster.local"
    - kafka-bootstrap.apps-crc.testing
    - "*.apps-crc.testing"
---
