# Default-deny baseline for auth-services, with explicit allow rules
# punched through - same house style as bootstrap/network-policies.yaml
# (see that file's header comment for the full explanation).
#
# Reminder of the confirmed OVN-Kubernetes egress bug this cluster has:
# port-restricted Egress rules silently drop all traffic on the "allowed"
# port, even with a matching peer selector. Every Egress rule below
# restricts by peer only, never by port (including the "DNS egress"
# rules - conceptually port 53, but implemented peer-only for the same
# reason bootstrap/network-policies.yaml's allow-dns-egress is peer-only).
# Ingress port-restriction is unaffected and used everywhere below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: auth-services
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Samba AD DC (replaces the old separate LDAP+KDC pair - it's a single
# process implementing LDAP, Kerberos KDC, and SMB/RPC together, so there's
# no more internal ldap<->kdc traffic to allow between two pods).
#
# Ingress: Kafka Connect (confluent namespace) only ever needs Kerberos
# ticket requests (port 88) - it never binds to LDAP or changes its own
# password, so 389/464 aren't opened to it. SQL Server itself (Docker
# Desktop, reached via an SSH reverse tunnel through the CRC node - see
# docs/kerberos-architecture.md) needs real domain-join access (88, 389,
# 445, 464) for sssd's ad provider to trust this realm; that traffic
# arrives via the node's own network path, not as a normal cluster peer,
# so it can't be expressed with a podSelector/namespaceSelector the way
# the confluent-namespace rule below is.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: samba-ad-ingress
  namespace: auth-services
spec:
  podSelector:
    matchLabels:
      app: samba-ad
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: confluent
      ports:
        - protocol: TCP
          port: 88
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: samba-ad-package-mirror-egress
  namespace: auth-services
spec:
  # samba-ad installs the samba/krb5-user/winbind packages via apt-get at
  # container startup (see base/samba-ad/samba-ad-deployment.yaml for why
  # no pre-built image exists) - this needs real internet egress, unlike
  # every other rule in this repo which only ever allows in-cluster peers.
  podSelector:
    matchLabels:
      app: samba-ad
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: auth-services
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-egress
  namespace: auth-services
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argocd-access
  namespace: auth-services
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
