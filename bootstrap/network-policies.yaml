apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: connect-external-egress
  namespace: confluent
spec:
  # Two reasons this pod needs real internet/external egress, unlike every
  # other rule in this repo which only ever allows in-cluster peers:
  # 1. connect-kerberos-patch.yaml's spec.build.onDemand.plugins.confluentHub
  #    installs the JDBC Source Connector plugin via a real internet
  #    download (Confluent Hub) at pod-init time. Confirmed live: without
  #    this, config-init-container's `confluent connect plugin install`
  #    step hangs for its full ~3 minute connect timeout and fails, leaving
  #    connect-0 stuck at Init:0/1 in a permanent CrashLoopBackOff.
  # 2. SQL Server itself runs outside this cluster (see
  #    docs/kerberos-architecture.md - mssql/server is amd64-only and this
  #    node is arm64), reachable only via an external address, not an
  #    in-cluster Service. Scoped to the connect pod only.
  podSelector:
    matchLabels:
      app: connect
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
