# Default-deny baseline in the confluent namespace with explicit
# allow rules punched through for each required communication path.
#
# NOTE on egress rules: this cluster's OVN-Kubernetes build has a
# confirmed bug where port-restricted Egress NetworkPolicy rules silently
# drop ALL traffic on the "allowed" port (verified by bisection: fully-open
# egress works, egress restricted by peer-only works, egress restricted by
# port - with or without a peer selector - times out even for otherwise-
# permitted traffic like DNS). Ingress port-restriction is unaffected and
# verified working. So every egress rule below restricts by peer
# (podSelector/namespaceSelector) only, never by port - the corresponding
# destination's ingress rule is what actually enforces the port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: confluent
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: confluent-operator-management
  namespace: confluent
spec:
  # The CFK operator polls every component's Jolokia/JMX/Prometheus endpoints
  # for status (e.g. Kafka URP counts, KRaft log-end-offset) to compute CR
  # status.phase/conditions. Without this, those queries time out and the CR
  # sits ApplyFailed/Progressing forever even though the pod itself is
  # healthy: 'failed URP query to kafka-0...:7777/jolokia/: i/o timeout'.
  # Port 8090 is Kafka's own REST Admin API, which the operator also calls
  # to reconcile KafkaTopic CRs - confirmed live that a KafkaTopic sits in
  # ERROR ('dial tcp ...:8090: i/o timeout') without this port open too.
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: confluent-operator
      ports:
        - protocol: TCP
          port: 7777
        - protocol: TCP
          port: 7778
        - protocol: TCP
          port: 7203
        - protocol: TCP
          port: 8090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-scrape-confluent
  namespace: confluent
spec:
  # Prometheus (namespace monitoring) scrapes every JVM-based component's
  # JMX-Prometheus-exporter endpoint - confirmed live on all six workloads
  # (kafka, kraftcontroller, connect, schemaregistry, controlcenter,
  # kafkarestproxy) that port 7778 already serves real Prometheus-exposition
  # text with zero CR changes. Without this rule the scrape times out the
  # same way the CFK operator's own polling did before
  # confluent-operator-management existed (see that policy's comment).
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 7778
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-internal-replication
  namespace: confluent
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
    - Egress
  # Real listener ports confirmed from the running broker's advertised.listeners:
  # INTERNAL=9071, REPLICATION=9072, EXTERNAL=9092, CONTROLLER(kraft)=9074.
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9071
        - protocol: TCP
          port: 9072
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: kafka
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-to-kraft
  namespace: confluent
spec:
  # Kafka brokers connect OUT to the KRaft controller quorum (to register,
  # fetch metadata, etc.) on its controller listener port - confirmed against
  # the live KRaftController status (.status.listeners.controller), which is
  # 9074, not 9092/9093 as originally assumed. Port enforced on the
  # kraft-from-kafka ingress side instead (see egress note above).
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: kraftcontroller
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kraft-from-kafka
  namespace: confluent
spec:
  podSelector:
    matchLabels:
      app: kraftcontroller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9074
---
