---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: controlcenter-self
  namespace: confluent
spec:
  # ControlCenter calls its own prometheus/alertmanager sidecar containers via
  # the controlcenter-prometheus/-alertmanager Service aliases (ClusterIP),
  # which routes back to the same pod through the network stack rather than
  # a raw loopback - still subject to ingress NetworkPolicy.
  podSelector:
    matchLabels:
      app: controlcenter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: controlcenter
      ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 9093
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: controlcenter-egress
  namespace: confluent
spec:
  # ControlCenter is a client to kafka, schemaregistry, and connect - peer-only
  # per the egress note above, ports enforced by each destination's ingress rule.
  podSelector:
    matchLabels:
      app: controlcenter
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: kafka
        - podSelector:
            matchLabels:
              app: schemaregistry
        - podSelector:
            matchLabels:
              app: connect
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: controlcenter-to-kafka
  namespace: confluent
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: controlcenter
      ports:
        - protocol: TCP
          port: 9071
---
apiVersion: networking.k8s.io/v1
