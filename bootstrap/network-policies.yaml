# Default-deny baseline in the confluent namespace with explicit
# allow rules punched through for each required communication path.
#
# NOTE on egress rules: this cluster's OVN-Kubernetes build has a
# confirmed bug where port-restricted Egress NetworkPolicy rules silently
# drop ALL traffic on the "allowed" port (verified by bisection: fully-open
# egress works, egress restricted by peer-only works, egress restricted by
# port - with or without a peer selector - times out even for otherwise-
# permitted traffic like DNS). Ingress port-restriction is unaffected and
# verified working. So every egress rule below restricts by peer
# (podSelector/namespaceSelector) only, never by port - the corresponding
# destination's ingress rule is what actually enforces the port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: confluent
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-internal-replication
  namespace: confluent
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 9094
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: kafka
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-to-kraft
  namespace: confluent
spec:
  # Kafka brokers connect OUT to the KRaft controller quorum (to register,
  # fetch metadata, etc.) on its controller listener port - confirmed against
  # the live KRaftController status (.status.listeners.controller), which is
  # 9074, not 9092/9093 as originally assumed. Port enforced on the
  # kraft-from-kafka ingress side instead (see egress note above).
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: kraftcontroller
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kraft-from-kafka
  namespace: confluent
spec:
  podSelector:
    matchLabels:
      app: kraftcontroller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9074
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: schemaregistry-to-kafka
  namespace: confluent
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: schemaregistry
      ports:
        - protocol: TCP
          port: 9092
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: connect-to-kafka-sr
  namespace: confluent
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: connect
      ports:
        - protocol: TCP
          port: 9092
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flink-to-kafka
  namespace: confluent
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flink-jobs
      ports:
        - protocol: TCP
          port: 9092
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argocd-access
  namespace: confluent
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: confluent
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-egress
  namespace: confluent
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
