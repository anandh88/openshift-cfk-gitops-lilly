# This repo deliberately carries no custom SecurityContextConstraints (see
# docs/troubleshooting.md "Pod not starting: SCC violation" and the removal
# of the former confluent-platform-scc) - every workload's
# podSecurityContext omits runAsUser/fsGroup so OpenShift's built-in
# restricted-v2 SCC can assign both from the namespace's own allocated
# range. Rather than defining a brand-new custom SCC, this binds
# OpenShift's own built-in `anyuid` SCC - narrowly, to auth-services-sa
# only - via the same RoleBinding-to-system-ClusterRole mechanism
# `oc adm policy add-scc-to-user anyuid -z auth-services-sa -n
# auth-services` would create. Confirmed-live finding, not speculative
# hardening: auth-services-sa (KDC) installs Debian packages via apt-get
# at container startup, and dpkg's post-install scripts need real root
# capabilities (CAP_CHOWN/CAP_FOWNER). Also covers ldap in the same
# namespace - confirmed live that osixia/openldap's s6-overlay process
# supervisor fails silently under restricted-v2's forced
# capabilities.drop:[ALL], and restricted-v2 only allows adding back
# NET_BIND_SERVICE, so no capabilities.add combination satisfies both
# restricted-v2 and what the image needs.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auth-services-sa-anyuid
  namespace: auth-services
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: auth-services-sa
    namespace: auth-services
