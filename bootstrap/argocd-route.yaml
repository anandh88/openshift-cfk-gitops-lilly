# Passthrough route so Argo CD terminates its own TLS (argocd-server-tls,
# see argocd-tls-cert.yaml) instead of the OpenShift router re-encrypting.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: argocd-server
  namespace: argocd
spec:
  host: argocd-server.apps-crc.testing
  to:
    kind: Service
    name: argocd-server
    weight: 100
  port:
    targetPort: https
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
